<meta charset="utf-8" />
<title>熊熊甜點小徑</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#170f28" />
<meta name="description" content="一張要兩道密碼才能打開的像素風生日賀卡。" />
<meta property="og:type" content="website" />
<meta property="og:title" content="熊熊甜點小徑" />
<meta property="og:description" content="一封被封起來的信，兩道密碼，還有一隻邊走邊吃甜點的熊。" />

<style>
  /* ============================================================
     熊熊甜點小徑 — 像素風互動生日賀卡
     刻意單一視覺世界（黃昏 → 白天的像素電玩螢幕），
     所有顏色都明確指定，不跟隨瀏覽器深淺主題。
     ============================================================ */
  /* 機身走深青板岩，接住畫面裡天空的冷色；
     奶油、奶油黃、糖果粉這些暖調就會跳出來 */
  :root {
    --ink:        #0d191e;    /* 描邊／最深 */
    --shell:      #172b33;    /* 機身 */
    --shell-2:    #21404b;    /* 凸起的元件 */
    --shell-3:    #2f5c6b;    /* 滑過 */
    --shell-line: #3d7182;    /* 細節線 */
    --cream:      #fff4de;
    --cream-dim:  #9fb6bd;
    --butter:     #ffd15c;
    --candy:      #ff8fb1;
    --mint:       #7fe3c9;
    --caramel:    #c98a5b;
    --u:          5px;        /* 像素字的一格 */
    --sans: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC",
            "Hiragino Sans TC", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--ink);
    background-image:
      radial-gradient(ellipse at 50% -10%, #23434e 0%, #12242b 55%, #081014 100%);
    color: var(--cream);
    font-family: var(--sans);
    display: grid;
    grid-template-columns: minmax(0, 1fr);   /* auto 欄位會被 canvas 撐大，一定要夾住 */
    place-items: center;
    padding: 16px 12px calc(20px + env(safe-area-inset-bottom));
    overscroll-behavior-y: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- 機身 ---------- */
  .cabinet {
    width: 100%;
    min-width: 0;          /* 沒有這行，canvas 的內建 320px 會把版面撐爆手機螢幕 */
    max-width: 880px;
    background: var(--shell);
    border: 3px solid var(--ink);
    /* 上緣一道亮邊、下方硬陰影，讓機身有厚度 */
    box-shadow:
      inset 0 2px 0 0 rgba(255,255,255,.07),
      0 10px 0 0 #081319,
      0 14px 46px rgba(0,0,0,.6);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    /* 像素缺角，取代圓角 */
    clip-path: polygon(
      8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px),
      calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    min-width: 0;
    user-select: none;
  }

  .eyebrow {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--cream-dim);
  }

  /* 進度：真實狀態，不是裝飾 */
  .pips { display: flex; gap: 5px; margin-left: auto; align-items: center; }
  .pip {
    width: 9px; height: 9px;
    background: var(--shell-2);
    box-shadow: inset 0 0 0 2px var(--ink);
  }
  .pip.on {
    background: var(--butter);
    box-shadow: inset 0 0 0 2px var(--ink), 0 0 7px rgba(255,209,92,.65);
  }

  .sound {
    appearance: none;
    border: 2px solid var(--ink);
    background: var(--shell-2);
    color: var(--cream);
    font: inherit;
    font-size: 13px;
    line-height: 1;
    padding: 9px 10px;
    min-height: 38px;
    cursor: pointer;
    touch-action: manipulation;
    white-space: nowrap;
  }
  .sound:hover { background: var(--shell-3); }

  /* ---------- 螢幕 ---------- */
  .bezel {
    position: relative;
    background: #081317;
    border: 3px solid var(--ink);
    padding: 9px;
    min-width: 0;
    box-shadow:
      inset 0 3px 16px rgba(0,0,0,.9),
      inset 0 0 0 1px rgba(61,113,130,.35);   /* 內側細亮線 */
    display: flex;
    justify-content: center;
  }
  /* 機身上的小電源燈 */
  .bezel::after {
    content: "";
    position: absolute;
    right: 7px; bottom: 6px;
    width: 4px; height: 4px;
    background: var(--mint);
    box-shadow: 0 0 6px rgba(127,227,201,.9);
  }
  .screen-wrap {
    position: relative;
    width: 100%;
    min-width: 0;
  }
  /* 掃描線 + 暗角：讓它像一塊真的小螢幕 */
  .screen-fx {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      repeating-linear-gradient(to bottom,
        rgba(0,0,0,.11) 0 1px, rgba(0,0,0,0) 1px 3px),
      radial-gradient(ellipse 80% 78% at 50% 46%,
        rgba(0,0,0,0) 58%, rgba(4,14,18,.38) 100%);
  }
  /* 玻璃上的一道斜向反光 */
  .screen-fx::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(122deg,
      rgba(255,255,255,.075) 0%, rgba(255,255,255,.02) 26%,
      rgba(255,255,255,0) 46%);
  }
  .scene-ui { z-index: 2; }
  canvas.screen {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 320 / 180;   /* JS 會依螢幕比例改寫 */
    background: #101f26;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: pointer;
    touch-action: manipulation;
  }

  /* ---------- 場景內的像素對話框 ---------- */
  .scene-ui {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 3.2%;
    pointer-events: none;      /* 只有框本身要吃點擊 */
  }
  .pxbox {
    pointer-events: auto;
    position: relative;
    display: block;
    width: 100%;
    max-width: 62ch;
    margin: 0 auto;
    appearance: none;
    border: 0;
    font: inherit;
    text-align: left;
    background: var(--ink);          /* 外框 */
    padding: 4px;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 4px 0 0 rgba(0,0,0,.45);
    clip-path: polygon(
      8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px),
      calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
  }
  /* display:block 會蓋掉 [hidden] 的預設值，要自己補回來 */
  .pxbox[hidden] { display: none; }
  .pxbox[aria-disabled="true"] { cursor: default; }
  .pxbox:hover:not([aria-disabled="true"]) .pxbox-in { background: #fffaea; }
  .pxbox:active:not([aria-disabled="true"]) { transform: translateY(2px); }
  .pxbox:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }

  .pxbox-in {
    display: block;
    background: var(--cream);
    color: var(--ink);
    padding: 9px 12px 13px;
    box-shadow: inset 0 0 0 2px #cdb391;
    clip-path: polygon(
      5px 0, calc(100% - 5px) 0, 100% 5px, 100% calc(100% - 5px),
      calc(100% - 5px) 100%, 5px 100%, 0 calc(100% - 5px), 0 5px);
  }
  .pxbox-title {
    display: block;
    font-size: clamp(20px, 5.2vw, 32px);
    font-weight: 900;
    letter-spacing: .06em;
    line-height: 1.15;
    color: #bf3a63;
    text-shadow: 3px 3px 0 #f3d9b6;
    margin-bottom: 6px;
  }
  .pxbox-title[hidden] { display: none; }
  .pxbox-text {
    display: block;
    font-size: clamp(13px, 3.3vw, 17px);
    font-weight: 700;
    line-height: 1.65;
    text-wrap: pretty;
  }
  .pxbox-next {
    position: absolute;
    right: 13px; bottom: 8px;
    font-size: 11px;
    color: #8a6f4e;
    animation: blink 1s steps(2, jump-none) infinite;
  }
  .pxbox-next[hidden] { display: none; }

  /* 要玩家點一下畫面時出現的小提示條 */
  .pxhint {
    pointer-events: auto;
    display: block;
    width: fit-content;
    max-width: 100%;
    margin: 0 auto;
    appearance: none;
    border: 0;
    font: inherit;
    background: var(--ink);
    padding: 3px;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 3px 0 0 rgba(0,0,0,.45);
    clip-path: polygon(
      6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px),
      calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px);
    animation: hintbob 1.15s steps(2, jump-none) infinite;
  }
  .pxhint[hidden] { display: none; }
  .pxhint:hover .pxhint-in { background: #fffaea; }
  .pxhint:active { transform: translateY(2px); }
  .pxhint:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }
  .pxhint-in {
    display: block;
    background: var(--cream);
    color: var(--ink);
    padding: 6px 13px;
    font-size: clamp(12px, 3vw, 15px);
    font-weight: 800;
    white-space: nowrap;
    box-shadow: inset 0 0 0 2px #cdb391;
    clip-path: polygon(
      4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px),
      calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
  }
  @keyframes hintbob { 50% { transform: translateY(-3px); } }

  /* ---------- 下方面板 ---------- */
  .console { display: flex; flex-direction: column; gap: 12px; }
  .panel { display: flex; flex-direction: column; gap: 12px; }
  .panel[hidden] { display: none; }

  .lede {
    margin: 0;
    font-size: clamp(15px, 2.4vw, 19px);
    font-weight: 800;
    line-height: 1.55;
    letter-spacing: .02em;
    text-wrap: balance;
    text-shadow: 2px 2px 0 var(--ink);
  }
  .sub {
    margin: 0;
    font-size: 13px;
    line-height: 1.6;
    color: var(--cream-dim);
  }

  /* 密碼列 */
  .code-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  /* 透明的真 input 疊在數字格上面：手機點下去就直接叫出數字鍵盤，
     不必靠程式 focus（iOS 對程式 focus 很挑） */
  .code-field { position: relative; display: inline-flex; user-select: none; }
  .code-field:focus-within { outline: 3px solid var(--mint); outline-offset: 4px; }
  .code-input {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    margin: 0; padding: 0; border: 0;
    background: transparent;
    color: transparent;
    caret-color: transparent;
    font-size: 16px;          /* 小於 16px 時 iOS 會自動放大整頁 */
    opacity: 0;
    cursor: pointer;
    touch-action: manipulation;
  }
  .code-input:focus { outline: none; }
  .slots { display: flex; gap: 8px; }
  .slot {
    width: calc(var(--u) * 3 + 22px);
    height: calc(var(--u) * 5 + 20px);
    background: #081317;
    border: 2px solid var(--ink);
    box-shadow: inset 0 2px 8px rgba(0,0,0,.85),
                inset 0 0 0 1px rgba(61,113,130,.3);
    display: grid;
    place-items: center;
    position: relative;
  }
  .slot.active { border-color: var(--butter); }
  .slot.active::after {
    content: "";
    position: absolute;
    inset: auto 6px 5px 6px;
    height: 3px;
    background: var(--butter);
    animation: blink 1s steps(2, jump-none) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* 手繪 3×5 像素數字 */
  .pxd {
    display: grid;
    grid-template-columns: repeat(3, var(--u));
    grid-auto-rows: var(--u);
    gap: 1px;
  }
  .pxd i { display: block; }
  .pxd i.on { background: var(--butter); box-shadow: 1px 1px 0 rgba(0,0,0,.45); }

  .shake { animation: shake .34s steps(3, jump-none) 2; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    33% { transform: translateX(-6px); }
    66% { transform: translateX(6px); }
  }


  .msg { margin: 0; font-size: 13px; font-weight: 700; min-height: 1.3em; }
  .msg.err { color: var(--candy); }
  .msg.hint { color: var(--butter); }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  .btn {
    appearance: none;
    font: inherit;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: .04em;
    padding: 12px 20px;
    min-height: 48px;                 /* 手指按得到 */
    border: 3px solid var(--ink);
    background: var(--butter);
    color: var(--ink);
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    box-shadow: 0 5px 0 0 #b8892a;
    transition: transform .06s steps(2, jump-none),
                box-shadow .06s steps(2, jump-none);
  }
  .btn:hover { background: #ffdc82; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 0 #b8892a; }
  .btn.ghost {
    background: var(--shell-2);
    color: var(--cream);
    box-shadow: 0 5px 0 0 #0b1a20;
  }
  .btn.ghost:hover { background: var(--shell-3); }
  .btn:focus-visible, .sound:focus-visible {
    outline: 3px solid var(--mint);
    outline-offset: 3px;
  }

  .foot {
    font-size: 11px;
    color: #6f5b93;
    letter-spacing: .1em;
    text-align: center;
  }

  @media (max-width: 560px) {
    :root { --u: 4px; }
    .cabinet { padding: 11px; gap: 11px; }
    .bezel { padding: 6px; }
    .btn { padding: 11px 16px; font-size: 15px; }
    .pxbox-in { padding: 8px 10px 12px; }
    .foot { font-size: 10px; }
  }
  @media (max-width: 360px) {
    :root { --u: 3px; }
    .slots { gap: 6px; }
    .btn { padding: 10px 13px; }
  }
  /* 橫躺的手機：高度很少但寬度有餘，把螢幕和面板並排，
     這樣畫面可以吃掉幾乎整個高度，而不是被擠成一條 */
  @media (orientation: landscape) and (max-height: 520px) {
    body { padding: 6px 8px; }
    .cabinet {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
      grid-template-areas: "top top" "screen console";
      align-items: start;
      gap: 8px 12px;
      padding: 9px;
    }
    .topbar  { grid-area: top; }
    .bezel   { grid-area: screen; padding: 5px; }
    .console { grid-area: console; }
    .lede { font-size: 15px; }
    .pxbox-in { padding: 7px 10px 11px; }
    .pxbox-text { font-size: 14px; line-height: 1.5; }
    .pxbox-title { font-size: 22px; }
    .btn { min-height: 44px; padding: 9px 14px; }
    .foot { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>

<div class="cabinet">
  <div class="topbar">
    <span class="eyebrow" id="eyebrow">封印 1 / 2</span>
    <div class="pips" id="pips" aria-hidden="true"></div>
    <button class="sound" id="soundBtn" type="button" aria-pressed="true">
      🔊 音樂開
    </button>
  </div>

  <div class="bezel">
    <div class="screen-wrap" id="screenWrap">
      <canvas class="screen" id="screen" width="320" height="180"
              role="img" aria-label="像素風場景：一封用蠟封起來的信"></canvas>
      <div class="screen-fx" aria-hidden="true"></div>

      <!-- 場景裡的像素對話框：賀詞直接長在熊的畫面上 -->
      <div class="scene-ui" id="sceneUI" hidden>
        <button class="pxhint" id="sceneHint" type="button" hidden>
          <span class="pxhint-in"><span id="sceneHintText"></span> <span aria-hidden="true">▶</span></span>
        </button>
        <button class="pxbox" id="sceneDialog" type="button">
          <span class="pxbox-in">
            <span class="pxbox-title" id="sceneTitle" hidden>生日快樂</span>
            <span class="pxbox-text" id="sceneText"></span>
          </span>
          <span class="pxbox-next" id="sceneNext" aria-hidden="true">▼</span>
        </button>
      </div>
    </div>
  </div>

  <div class="console">
    <!-- 密碼關卡 -->
    <section class="panel" id="panelGate">
      <p class="lede" id="gateLede">有一封信被封起來了，需要第一道密碼。</p>
      <div class="code-row">
        <div class="code-field" id="codeField">
          <div class="slots" id="slots" aria-hidden="true"></div>
          <input class="code-input" id="codeInput" type="text"
                 inputmode="numeric" pattern="[0-9]*" autocomplete="off"
                 maxlength="4" aria-label="四位數密碼" />
        </div>
        <button class="btn" id="openBtn" type="button">解開</button>
      </div>
      <p class="msg" id="gateMsg"></p>
    </section>

    <!-- 過場（動畫中） -->
    <section class="panel" id="panelWait" hidden>
      <p class="lede" id="waitLede">……</p>
    </section>

    <!-- 結尾（賀詞在畫面裡，這裡只留說明） -->
    <section class="panel" id="panelEnd" hidden>
      <div class="row">
        <button class="btn" id="replayBtn" type="button">再玩一次</button>
      </div>
    </section>
  </div>

  <p class="foot" id="foot" hidden>點畫面熊才會前進；點吉娃娃牠會回你話</p>
</div>

<noscript>
  <p style="text-align:center">這張賀卡需要開啟 JavaScript 才能打開喔。</p>
</noscript>

<script>
/* ==================================================================
   ①  可以改的地方都在這裡
   ================================================================== */
const CONFIG = {
  to: "",                       // 收件人名字，留空就不顯示
  code1: "0819",
  code2: "0727",
  lede1: "有一封信被封起來了，需要第一道密碼。",
  lede2: "信拿出來了，但卡片還鎖著。第二道密碼。",
  hint1: "提示：4 位數字，一個屬於你的日期。",
  hint2: "提示：小狗狗的日期。",

  /* 甜點池：每次玩會從這裡隨機抽 6 個，位置也會抖動，
     所以每次走的路都不一樣。鮭魚是熊的最愛，一定會出現。 */
  treatCount: 6,
  treats: [
    { kind: "salmon", always: true,
      text: "鮭魚！熊等這個等很久了。願你今年也常常遇到自己最想要的那一個。" },
    { kind: "donut",
      text: "甜甜圈中間的洞是留給煩惱的，其他甜的部分都是你的。" },
    { kind: "cupcake",
      text: "願你接下來的每一天，都像剛出爐一樣蓬鬆又柔軟。" },
    { kind: "icecream",
      text: "就算世界有時候很燙，也希望你永遠不要融化。" },
    { kind: "pudding",
      text: "祝你走路都會遇到好事，像布丁一定會遇到焦糖那樣。" },
    { kind: "cake",
      text: "最上面那顆草莓，永遠是你的，沒有人可以跟你搶。" },
    { kind: "macaron",
      text: "又長大一歲了，恭喜你把日子過得這麼好。" },
    { kind: "honey",
      text: "願你今年的煩惱都黏在罐子邊，怎麼倒都倒不出來。" },
    { kind: "cookie",
      text: "你比你自己以為的還要更耐放，也更受歡迎一點。" },
    { kind: "taiyaki",
      text: "希望你每次翻開的那一面，都剛好是有餡的那一面。" }
  ],
  ending: "熊熊已經吃飽了，換你把接下來的一年，一口一口吃成甜的。"
};

/* ==================================================================
   ②  像素畫核心
   ================================================================== */
/* 高度固定 180，寬度會依螢幕比例調整：
   直式手機拿到比較窄的畫面（像素變大），橫躺時變寬。 */
let W = 320;
const H = 180;
const cv = document.getElementById("screen");
const ctx = cv.getContext("2d");
cv.width = W; cv.height = H;
ctx.imageSmoothingEnabled = false;

const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const spd = RM ? 0.3 : 1;                 // 動畫時間縮放

function px(x, y, w, h, c) {
  ctx.fillStyle = c;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
function ell(cx, cy, rx, ry, c) {         // 像素橢圓（整數對齊）
  ctx.fillStyle = c;
  cx = Math.round(cx); cy = Math.round(cy);
  rx = Math.round(rx); ry = Math.round(ry);
  for (let dy = -ry; dy <= ry; dy++) {
    const k = 1 - (dy * dy) / ((ry + 0.5) * (ry + 0.5));
    if (k <= 0) continue;
    const dx = Math.round((rx + 0.5) * Math.sqrt(k));
    ctx.fillRect(cx - dx, cy + dy, dx * 2 + 1, 1);
  }
}
const disc = (cx, cy, r, c) => ell(cx, cy, r, r, c);
function ellO(cx, cy, rx, ry, fill, line) {   // 帶描邊
  ell(cx, cy, rx + 1, ry + 1, line);
  ell(cx, cy, rx, ry, fill);
}
function tri(x1,y1,x2,y2,x3,y3,c) {
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.moveTo(Math.round(x1), Math.round(y1));
  ctx.lineTo(Math.round(x2), Math.round(y2));
  ctx.lineTo(Math.round(x3), Math.round(y3));
  ctx.closePath();
  ctx.fill();
}
function box(x, y, w, h, fill, line) {
  px(x - 1, y - 1, w + 2, h + 2, line);
  px(x, y, w, h, fill);
}
const hx = c => [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ease  = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
const easeOut = t => 1 - Math.pow(1 - t, 3);

/* 固定亂數，讓草地細節每次都長在同一個地方 */
let _seed = 20260819;
function rnd() { _seed = (_seed * 1103515245 + 12345) & 0x7fffffff; return _seed / 0x7fffffff; }

/* ==================================================================
   ③  調色盤（黃昏 → 白天）
   ================================================================== */
/* 天空用 7 段色階 + 4×4 有序抖動，漸層才不會是一條一條的硬邊 */
/* 天空有三組色階，隨著熊吃掉的甜點從白天走到夜晚 */
const SKY_DAY   = ["#3f9ada","#54abe3","#6bbaeb","#87ccf1","#a6dbf7","#c7eafb","#e8f7fe"];
const SKY_DUSK  = ["#2c3b78","#4c4088","#7a4685","#ad5580","#e0757a","#f79f76","#ffcf9c"];
const SKY_NIGHT = ["#04081a","#080e28","#0d1436","#121a44","#182150","#1e295e","#26336c"];
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
/* 這裡就要宣告：applyMetrics() 在下面立刻執行，會用到它 */
let skyImg = null, skyPrev = null, skyFade = 1, skyLevel = -1;

const HILL_FAR   = "#74b9c6", HILL_FAR_RIM  = "#9ad7e0";
const HILL_NEAR  = "#3f9668", HILL_NEAR_RIM = "#63bd8a";
const GRASS_TOP  = "#78d165", GRASS_MID = "#5cb955", GRASS_BOT = "#3f9445";
const GRASS_FG   = "#2f7a3d";
const DIRT       = "#cba676", DIRT_2 = "#a8814f", DIRT_HI = "#dcbb8d";
const CLOUD      = "#ffffff", CLOUD_SHADE = "#cfe4f5";

const INK    = "#241528";
const BEAR   = "#c98a5b";
const BEAR_D = "#a4693f";
const BEAR_L = "#f2d3ae";
const CANDY  = "#ff8fb1";
const MINT   = "#7fe3c9";
const BUTTER = "#ffd15c";
const CREAM  = "#fff4de";
const BALLOON_COLORS = ["#ff8fb1","#ffd15c","#7fe3c9","#c9a7e8","#ff9e6d","#8fd0ff","#ff6f91"];

/* ==================================================================
   ④  世界設定
   ================================================================== */
const WORLD_W  = 1560;
const GRASS_Y  = 132;            // 地平線（草地上緣）
const PATH_Y   = 150;            // 小路
const PATH_H   = 18;
const GROUND_Y = 156;            // 熊腳底（踩在小路上）
const FG_Y     = PATH_Y + PATH_H; // 前景草
const DESSERT_X = [150, 340, 530, 730, 930, 1120];
const CAKE_X    = 1330;
const DOG_X     = 1366;          // 吉娃娃坐在蛋糕右邊
const BEAR_END_X = 1286;         // 熊 → 蛋糕 → 吉娃娃，三個都不重疊
const FINALE_CX  = 1326;         // 結尾鏡頭對準三者的正中間

/* 這些都跟畫面寬度有關，W 一變就要重算 */
let CAM_MAX, CAM_LEAD, BALLOON_SPAN, BALLOON_N, SKY_OBJ_X;
let ENV_W, ENV_H, ENV_CX, ENV_CY, CRD_W, CRD_H;
function applyMetrics() {
  CAM_MAX      = WORLD_W - W;
  CAM_LEAD     = Math.round(W * 0.37);          // 熊在畫面上的位置
  BALLOON_SPAN = W + CAM_MAX * 0.5 + 40;        // 氣球視差 0.5，只有這段會被看到
  BALLOON_N    = Math.min(120, Math.round(BALLOON_SPAN / W * 20));  // 每個畫面固定約 20 顆
  SKY_OBJ_X    = W - 54;                        // 太陽／月亮

  // 信封佔滿畫面：先照寬度算，太高就改照高度算回來
  ENV_H = Math.min(Math.round(W * 0.72 * 0.62), Math.round(H * 0.64));
  ENV_W = Math.round(ENV_H / 0.62);
  ENV_CX = Math.round(W / 2);
  ENV_CY = Math.round(H * 0.55);
  CRD_W = Math.round(ENV_W * 0.88);             // 卡片要塞得進信封
  CRD_H = Math.round(ENV_H * 0.84);
  skyImg = null; skyPrev = null; skyLevel = -1;  // 天空快取作廢，下一幀重建
}
applyMetrics();

const state = {
  scene: "gate1",     // gate1 | letterOut | gate2 | opening | walk | finale
  mode:  "idle",      // walking | eating | wish | toCake | celebrate
  t: 0, at: 0,        // at = 這個動畫階段已經過的毫秒
  day: 0,             // 0 = 黃昏, 1 = 白天
  idx: 0,             // 下一個要吃的甜點
  camX: 0,
  camY: 0,            // 對話框出現時整個世界往上讓，熊才不會被蓋住
  camYTarget: 0,
  flash: 0,
  gate: 1,
  tries: 0,
  stuckAt: null,          // 這一段路會在哪裡卡住（null = 不卡）
  pendingFinale: false
};

const bear = { x: 60, phase: 0, hop: 0, mood: "idle", blinkAt: 0, fat: 0, push: 0 };
/* 洗牌後抽 treatCount 個，鮭魚保證入選，位置再各自抖一下 */
function rollDesserts() {
  const shuffle = a => {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };
  const must = CONFIG.treats.filter(t => t.always);
  const rest = shuffle(CONFIG.treats.filter(t => !t.always));
  const picked = shuffle(must.concat(rest).slice(0, CONFIG.treatCount));
  desserts = picked.map((t, i) => ({
    x: DESSERT_X[i] + Math.round((Math.random() - 0.5) * 44),
    kind: t.kind,
    text: t.text,
    special: !!t.always,
    bite: 0, gone: false
  }));
}
let desserts = [];
let balloons = [], clouds = [], confetti = [], crumbs = [], fireworks = [], fwParts = [];
let deco = [];

function initWorld() {
  _seed = 20260819;
  clouds = [];
  for (let i = 0; i < 7; i++)
    clouds.push({ x: rnd() * (W + 120), y: 14 + rnd() * 46, s: 1 + Math.round(rnd() * 1.6) });

  balloons = [];          // 氣球要等卡片打開才放出來
  deco = [];
  for (let i = 0; i < 190; i++) {
    const x = rnd() * WORLD_W;
    const r = rnd();
    deco.push({
      x,
      kind: r < .30 ? "tuft" : r < .64 ? "flower" : r < .82 ? "pebble" : "tuft2",
      c: BALLOON_COLORS[Math.floor(rnd() * BALLOON_COLORS.length)],
      y: rnd(),
      r: rnd()          // 花朵冒出來的門檻，越小越早出現
    });
  }
  rollDesserts();                 // 每次重來都換一批甜點
  confetti = []; crumbs = []; fireworks = []; fwParts = [];
}

/* 陣列要備到最滿的量，實際畫幾顆由 drawBalloons 依進度決定 */
const balloonMax = () => Math.round(BALLOON_N * 1.7);
function refillBalloons() {
  balloons = [];
  for (let i = 0; i < balloonMax(); i++) addBalloon(true);
}

function addBalloon(spread, fast) {
  balloons.push({
    x: Math.random() * BALLOON_SPAN - 20,
    y: spread ? -10 + Math.random() * 175 : H + 14 + Math.random() * 90,
    r: 4 + Math.round(Math.random() * 3),
    c: BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)],
    v: fast ? 52 + Math.random() * 46 : 6 + Math.random() * 11,
    ph: Math.random() * 6.28
  });
}

/* ==================================================================
   ⑤  背景
   ================================================================== */
/* 整片壓暗。用 setTransform 歸零，才不會被鏡頭的上下位移帶偏 */
function tintScreen(a) {
  if (a <= 0) return;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = Math.min(1, a);
  px(0, 0, W, H, "#070c28");
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* 夜裡在人物腳下鋪一圈暖光，讓他們從暗背景裡浮出來 */
function warmPool(cx, cy, r, strength) {
  if (strength <= 0) return;
  for (let i = 5; i >= 1; i--) {
    ctx.globalAlpha = strength * 0.055;
    ell(cx, cy, Math.round(r * i / 5), Math.round(r * i / 5 * 0.46), "#ffcf8a");
  }
  ctx.globalAlpha = 1;
}

/* 入夜程度：熊吃越多天越暗（0 = 正午，1 = 全黑） */
const night = () => clamp(rich(), 0, 1);

/* 三組色階之間插值，得到當下的天空 */
function skyRamp(t) {
  const a = t < 0.5 ? SKY_DAY : SKY_DUSK;
  const b = t < 0.5 ? SKY_DUSK : SKY_NIGHT;
  const k = t < 0.5 ? t / 0.5 : (t - 0.5) / 0.5;
  return a.map((c, i) => {
    const A = hx(c), B = hx(b[i]);
    return [Math.round(A[0] + (B[0] - A[0]) * k),
            Math.round(A[1] + (B[1] - A[1]) * k),
            Math.round(A[2] + (B[2] - A[2]) * k)];
  });
}

/* 抖動過的天空只在尺寸或入夜階段改變時重算，平常直接貼圖 */
function buildSky(t) {
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");
  const img = g.createImageData(W, H);
  const d = img.data;
  const cols = skyRamp(t);
  const seg = (H * 0.82) / (cols.length - 1);
  for (let y = 0; y < H; y++) {
    let p = y / seg;
    if (p > cols.length - 1) p = cols.length - 1;
    const i = Math.min(cols.length - 2, Math.floor(p));
    const t = p - i, a = cols[i], b = cols[i + 1];
    for (let x = 0; x < W; x++) {
      const col = t > (BAYER[y & 3][x & 3] + 0.5) / 16 ? b : a;
      const k = (y * W + x) * 4;
      d[k] = col[0]; d[k + 1] = col[1]; d[k + 2] = col[2]; d[k + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}

/* 把入夜程度切成 12 階，跨階時交叉淡入，看起來就是連續變暗 */
function ensureSky() {
  const lvl = Math.round(night() * 12);
  if (lvl === skyLevel && skyImg) return;
  skyPrev = skyImg;
  skyLevel = lvl;
  skyImg = buildSky(lvl / 12);
  skyFade = skyPrev ? 0 : 1;
}

function drawSky() {
  ensureSky();
  if (skyPrev && skyFade < 1) {
    ctx.drawImage(skyPrev, 0, 0);
    ctx.globalAlpha = skyFade;
    ctx.drawImage(skyImg, 0, 0);
    ctx.globalAlpha = 1;
  } else if (skyImg) {
    ctx.drawImage(skyImg, 0, 0);
  }

  const n = night();

  // 星星：入夜一半以後慢慢亮起來
  if (n > 0.34) {
    const sa = clamp((n - 0.34) / 0.5, 0, 1);
    _seed = 1337;
    for (let i = 0; i < 46; i++) {
      const stx = Math.round(rnd() * W), sty = Math.round(rnd() * H * 0.62);
      ctx.globalAlpha = sa * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(state.t / 520 + i * 1.7)));
      px(stx, sty, 1, 1, "#fff8e0");
    }
    ctx.globalAlpha = 1;
  }

  // 太陽會往下沉、顏色轉紅，沉到地平線下就看不見了
  const sy = 34 + n * 86;
  if (sy < GRASS_Y + 12) {
    const sx = SKY_OBJ_X;
    const warm = ["#ffd15c", "#ff9a4d", "#ff6f52"][n < .4 ? 0 : n < .75 ? 1 : 2];
    ctx.globalAlpha = .14; disc(sx, sy, 21 + n * 8, warm);
    ctx.globalAlpha = .22; disc(sx, sy, 16 + n * 5, warm);
    ctx.globalAlpha = 1;
    disc(sx, sy, 12, n < .5 ? "#fff6c8" : "#ffc48a");
    disc(sx, sy, 9, warm);
    disc(sx - 3, sy - 4, 3, "#fff8dc");
    if (n < 0.55) {
      for (let a = 0; a < 8; a++) {
        const an = a * Math.PI / 4 + state.t / 4000;
        const r = 17 + Math.sin(state.t / 620 + a) * 1.5;
        ctx.globalAlpha = 1 - n / 0.55;
        px(sx + Math.cos(an) * r, sy + Math.sin(an) * r, 2, 2, "#fff3b0");
        ctx.globalAlpha = 1;
      }
    }
  }

  // 月亮：太陽下山後從另一邊升起來
  if (n > 0.42) {
    const ma = clamp((n - 0.42) / 0.35, 0, 1);
    const mx = Math.round(W * 0.24), my = Math.round(46 - ma * 20);
    ctx.globalAlpha = ma * .13; disc(mx, my, 16, "#fff0c9");
    ctx.globalAlpha = ma;
    disc(mx, my, 8, "#fff0c9");
    disc(mx - 3, my - 2, 2, "#e6d4ac");
    disc(mx + 3, my + 2, 1, "#e6d4ac");
    disc(mx + 1, my - 4, 1, "#e6d4ac");
    ctx.globalAlpha = 1;
  }
}

function drawClouds() {
  const span = W + 120;
  clouds.forEach(cl => {
    let x = ((cl.x - state.camX * 0.22) % span + span) % span - 60;
    const s = cl.s;
    // 先畫下緣的陰影面，再疊上亮面，雲才有體積
    ell(x, cl.y + 2, 9 * s, 4 * s, CLOUD_SHADE);
    ell(x - 7 * s, cl.y + 4, 6 * s, 3 * s, CLOUD_SHADE);
    ell(x + 8 * s, cl.y + 4, 5 * s, 3 * s, CLOUD_SHADE);
    px(x - 13 * s, cl.y + 3, 27 * s, 3 * s, CLOUD_SHADE);
    ell(x, cl.y, 9 * s, 4 * s, CLOUD);
    ell(x - 7 * s, cl.y + 2, 6 * s, 3 * s, CLOUD);
    ell(x + 8 * s, cl.y + 2, 5 * s, 3 * s, CLOUD);
    px(x - 13 * s, cl.y + 2, 27 * s, 2 * s, CLOUD);
  });
}

function drawBalloons(dt) {
  // 顯示的顆數也隨進度增加，天空越來越滿
  const n = Math.min(balloons.length, Math.round(BALLOON_N * (0.8 + 0.85 * rich())));
  for (let i = 0; i < n; i++) {
    const b = balloons[i];
    b.y -= b.v * dt / 1000 * (RM ? .4 : 1);
    if (b.y < -30) { b.y = H + 14 + Math.random() * 60; b.x = Math.random() * BALLOON_SPAN - 20; }
    const x = Math.round(b.x - state.camX * 0.5 + Math.sin(state.t / 900 + b.ph) * 4);
    if (x < -20 || x > W + 20) continue;
    const y = Math.round(b.y);
    for (let k = 0; k < 11; k++)                    // 線
      px(x + Math.round(Math.sin(k / 3 + b.ph) * 1.4), y + b.r + 2 + k, 1, 1, "#4d7f92");
    ellO(x, y, b.r, b.r + 1, b.c, INK);
    ctx.globalAlpha = .22;                          // 底部暗面
    ell(x, y + 2, b.r - 1, b.r - 1, "#1b2b33");
    ctx.globalAlpha = 1;
    px(x - 1, y + b.r + 1, 3, 2, INK);
    px(x - b.r + 2, y - b.r + 1, 2, 2, "rgba(255,255,255,.75)");   // 高光
    px(x - b.r + 2, y - b.r + 3, 1, 1, "rgba(255,255,255,.45)");
  }
}

/* 每座山先畫一顆亮色，再把本色往下偏移 2px 蓋上去，
   露出來的那 2px 就是山脊上的反光 */
function drawHills() {
  const spanF = W + 200;
  for (let i = 0; i < 4; i++) {
    const x = ((i * 110 + 30 - state.camX * 0.3) % spanF + spanF) % spanF - 100;
    ell(x, GRASS_Y + 6, 66, 26, HILL_FAR_RIM);
    ell(x, GRASS_Y + 8, 66, 26, HILL_FAR);
  }
  const spanN = W + 160;
  for (let i = 0; i < 5; i++) {
    const x = ((i * 92 - state.camX * 0.55) % spanN + spanN) % spanN - 80;
    ell(x, GRASS_Y + 10, 48, 20, HILL_NEAR_RIM);
    ell(x, GRASS_Y + 12, 48, 20, HILL_NEAR);
  }
}

/* 熊吃得越多，世界越熱鬧（0 → 1） */
const rich = () => bear.fat;

function drawGround() {
  px(0, GRASS_Y, W, 3, GRASS_TOP);              // 地平線亮邊
  px(0, GRASS_Y + 3, W, 7, GRASS_MID);          // 中間調
  px(0, GRASS_Y + 10, W, PATH_Y - GRASS_Y - 10, GRASS_BOT);
  px(0, PATH_Y - 1, W, 1, "#2f7a3d");           // 草與路的交界
  px(0, PATH_Y, W, PATH_H, DIRT);               // 小路
  px(0, PATH_Y, W, 1, DIRT_HI);
  px(0, FG_Y - 1, W, 1, DIRT_2);
  px(0, FG_Y, W, H - FG_Y, GRASS_FG);           // 前景草（製造景深）

  const r = rich();
  deco.forEach(o => {
    const x = Math.round(o.x - state.camX);
    if (x < -8 || x > W + 8) return;
    if (o.kind === "tuft") {
      px(x, GRASS_Y - 2, 1, 3, GRASS_TOP);
      px(x + 1, GRASS_Y - 3, 1, 4, GRASS_TOP);
      px(x + 2, GRASS_Y - 1, 1, 2, GRASS_TOP);
    } else if (o.kind === "tuft2") {
      px(x, GRASS_Y + 7 + Math.round(o.y * 9), 3, 1, GRASS_TOP);
    } else if (o.kind === "flower") {
      if (o.r > 0.26 + 0.74 * r) return;        // 花會隨進度一朵一朵長出來
      const fy = GRASS_Y + 3 + Math.round(o.y * 9);
      px(x + 1, fy + 2, 1, 4, GRASS_BOT);
      px(x + 1, fy, 1, 1, o.c); px(x, fy + 1, 3, 1, o.c); px(x + 1, fy + 2, 1, 1, o.c);
      px(x + 1, fy + 1, 1, 1, CREAM);
    } else {
      px(x, PATH_Y + 4 + Math.round(o.y * (PATH_H - 7)), 2, 1, DIRT_2);
      px(x, PATH_Y + 3 + Math.round(o.y * (PATH_H - 7)), 2, 1, DIRT_HI);
    }
  });

  // 前景草的葉尖（視差比地面快，景深更明顯）
  deco.forEach(o => {
    if (o.kind !== "tuft") return;
    const x = Math.round(o.x * 1.4 - state.camX * 1.35);
    if (x < -6 || x > W + 6) return;
    px(x, FG_Y - 3, 1, 4, GRASS_FG); px(x + 1, FG_Y - 5, 1, 6, GRASS_FG);
    px(x + 2, FG_Y - 2, 1, 3, GRASS_FG);
  });
}

/* 彩旗：每吃掉一個甜點就多掛一串 */
function drawBunting() {
  const n = Math.round(rich() * DESSERT_X.length);
  for (let i = 0; i < n; i++) {
    const L = 118, x0 = DESSERT_X[i] + 52 - state.camX, y0 = 20 + (i % 2) * 7, sag = 15;
    if (x0 > W + 10 || x0 + L < -10) continue;
    for (let k = 0; k <= L; k += 1) {
      const t = k / L;
      px(x0 + k, y0 + Math.sin(t * Math.PI) * sag, 1, 1, "#2c5866");
    }
    for (let f = 0; f < 7; f++) {
      const t = (f + 0.5) / 7;
      const fx = Math.round(x0 + t * L), fy = Math.round(y0 + Math.sin(t * Math.PI) * sag);
      if (fx < -6 || fx > W + 6) continue;
      const c = BALLOON_COLORS[(i * 3 + f) % BALLOON_COLORS.length];
      tri(fx - 4, fy, fx + 4, fy, fx, fy + 10, INK);
      tri(fx - 3, fy + 1, fx + 3, fy + 1, fx, fy + 8, c);
    }
  }
}

/* 蝴蝶：吃到一半以後才會飛出來 */
function drawButterflies() {
  const n = Math.round(rich() * 6);
  for (let i = 0; i < n; i++) {
    const bx = DESSERT_X[i % DESSERT_X.length] + 90;
    const x = Math.round(bx + Math.sin(state.t / 980 + i * 2.1) * 26 - state.camX);
    if (x < -8 || x > W + 8) continue;
    const y = Math.round(GRASS_Y - 12 + Math.sin(state.t / 610 + i * 1.3) * 9);
    const c = BALLOON_COLORS[(i * 2 + 1) % BALLOON_COLORS.length];
    px(x, y, 1, 2, INK);
    if (Math.sin(state.t / 85 + i) > 0) {
      px(x - 3, y - 1, 3, 2, c); px(x + 2, y - 1, 3, 2, c);
    } else {
      px(x - 2, y - 2, 2, 3, c); px(x + 2, y - 2, 2, 3, c);
    }
  }
}

/* ==================================================================
   ⑥  熊
   ================================================================== */
/* 吃掉幾個甜點就胖幾分（0 = 原本身材，1 = 全部吃完） */
function fatness() {
  return desserts.filter(d => d.gone).length / desserts.length;
}

function drawBear(bx, by, opts) {
  opts = opts || {};
  const walk = opts.walk || 0;             // 走路相位
  const mood = opts.mood || "idle";        // idle | eat | happy | look
  const f = clamp(opts.fat || 0, 0, 1);    // 胖度
  const s = Math.sin(walk);
  const bob = Math.round(Math.abs(s) * 1.5);
  by = Math.round(by - (opts.lift || 0));

  // 走不動的時候整隻會抖，還會往前傾
  const stuck = mood === "stuck";
  const cx = Math.round(bx + (stuck ? Math.sin(state.t / 48) * 1.2 : 0));
  // 身體變寬變厚，重心跟著往下沉一點
  const brx = 9 + f * 10, bry = 8 + f * 5.5;
  const bodyY = by - 13 - bob + Math.round(f * 2);
  const armX  = Math.round(brx + 1);

  // 影子
  ctx.globalAlpha = .22;
  ell(cx, by + 1, 11 + f * 8, 2, "#000");
  ctx.globalAlpha = 1;

  // 腿（越胖分越開，也越粗）
  const spread = Math.round(f * 4);
  const legW = 5 + Math.round(f * 3);
  const l1 = Math.round(s * 3.2 * (1 - f * 0.45));
  const l2 = -l1;
  box(cx - 6 - spread + l1, by - 7, legW, 7, BEAR_D, INK);
  box(cx + 2 + spread + l2, by - 7, legW, 7, BEAR, INK);

  // 身體
  ellO(cx, bodyY, brx, bry, BEAR, INK);
  ell(cx, bodyY + 2, 6 + f * 7, 5 + f * 4, BEAR_L);

  // 手
  const a1 = Math.round(-s * 2.6 * (1 - f * 0.4));
  if (mood === "happy") {
    ellO(cx - armX - 1, bodyY - 8, 3, 3, BEAR_D, INK);
    ellO(cx + armX + 1, bodyY - 8, 3, 3, BEAR_D, INK);
  } else if (mood === "eat") {
    ellO(cx + armX - 1, bodyY - 3, 3, 3, BEAR_D, INK);
    ellO(cx - armX, bodyY + a1, 3, 3, BEAR_D, INK);
  } else if (stuck) {
    ellO(cx + armX + 2, bodyY + 1, 3, 3, BEAR_D, INK);   // 兩手往前撐
    ellO(cx + armX - 2, bodyY + 3, 3, 3, BEAR_D, INK);
  } else {
    ellO(cx - armX, bodyY + a1, 3, 3, BEAR_D, INK);
    ellO(cx + armX, bodyY - a1, 3, 3, BEAR_D, INK);
  }

  // 頭（跟著圓一點，但幅度比身體小，才不會整隻變成球）
  const hrx = 9 + f * 3, hry = 8 + f * 2.6;
  const hy = bodyY - 12 - Math.round(f * 3.5) + (stuck ? 2 : 0);
  const earX = Math.round(hrx - 2);
  ellO(cx - earX, hy - 5, 4, 4, BEAR_D, INK);       // 耳
  ellO(cx + earX, hy - 5, 4, 4, BEAR_D, INK);
  disc(cx - earX, hy - 5, 2, CANDY);
  disc(cx + earX, hy - 5, 2, CANDY);
  ellO(cx, hy, hrx, hry, BEAR, INK);

  // 派對帽
  tri(cx - 4, hy - hry, cx + 5, hy - hry, cx + 1, hy - hry - 12, INK);
  tri(cx - 3, hy - hry + 1, cx + 4, hy - hry + 1, cx + 1, hy - hry - 11, CANDY);
  px(cx - 2, hy - hry - 5, 5, 1, BUTTER);
  px(cx - 1, hy - hry - 8, 3, 1, BUTTER);
  disc(cx + 1, hy - hry - 12, 2, BUTTER);

  // 口鼻
  ell(cx + 1, hy + 3, 5, 4, BEAR_L);
  px(cx, hy + 1, 3, 2, "#4a2f22");

  // 眼睛（會眨）
  const blink = (state.t - bear.blinkAt) % 3600 < 130;
  if (blink) { px(cx - 6, hy - 1, 3, 1, INK); px(cx + 4, hy - 1, 3, 1, INK); }
  else {
    px(cx - 6, hy - 2, 2, 3, INK); px(cx + 4, hy - 2, 2, 3, INK);
    px(cx - 6, hy - 2, 1, 1, CREAM); px(cx + 4, hy - 2, 1, 1, CREAM);
  }
  const chk = Math.round(hrx - 1);                       // 腮紅跟著臉變寬
  px(cx - chk - 1, hy + 2, 2 + Math.round(f), 1, CANDY);
  px(cx + chk - 1, hy + 2, 2 + Math.round(f), 1, CANDY);

  // 嘴
  if (mood === "eat") {
    const chomp = Math.sin(state.t / 70) > 0 ? 3 : 1;
    ell(cx + 1, hy + 5, 2, chomp, "#7a3b3b");
  } else if (mood === "happy") {
    px(cx, hy + 5, 3, 1, INK); px(cx - 1, hy + 4, 1, 1, INK); px(cx + 3, hy + 4, 1, 1, INK);
  } else if (stuck) {
    px(cx - 1, hy + 4, 5, 2, "#7a3b3b");                 // 用力咬牙
    px(cx, hy + 4, 1, 1, CREAM); px(cx + 2, hy + 4, 1, 1, CREAM);
    const dy = Math.round((state.t / 90) % 6);            // 一滴汗
    px(cx + hrx + 2, hy - 6 + dy, 2, 3, "#8fd0ff");
    px(cx + hrx + 2, hy - 7 + dy, 2, 1, "#cfeaff");
  } else {
    px(cx, hy + 5, 3, 1, "#6b4632");
  }
}

/* ==================================================================
   ⑦  甜點
   ================================================================== */
function drawDessert(kind, x, by) {
  x = Math.round(x); by = Math.round(by);
  if (kind === "donut") {
    ellO(x, by - 7, 7, 6, "#e0a86a", INK);
    ell(x, by - 9, 7, 4, "#ff9fbd");
    px(x - 6, by - 10, 12, 1, "#ffc2d8");
    ell(x, by - 7, 2, 2, "#8a5a3a");
    px(x - 4, by - 11, 1, 1, MINT); px(x + 3, by - 10, 1, 1, BUTTER);
    px(x - 1, by - 12, 1, 1, "#8fd0ff"); px(x + 5, by - 8, 1, 1, MINT);
  } else if (kind === "cupcake") {
    px(x - 6, by - 7, 12, 8, INK);
    px(x - 5, by - 6, 10, 7, "#e8a33f");
    px(x - 3, by - 6, 1, 7, "#c9822a"); px(x + 1, by - 6, 1, 7, "#c9822a");
    ellO(x, by - 10, 7, 5, "#ff9fbd", INK);
    ell(x, by - 13, 5, 3, "#ffc2d8");
    ell(x, by - 15, 3, 2, "#ff9fbd");
    disc(x, by - 18, 2, "#e04a5f");
    px(x, by - 20, 1, 2, "#4a8f3a");
  } else if (kind === "icecream") {
    tri(x - 6, by - 9, x + 6, by - 9, x, by + 1, INK);
    tri(x - 5, by - 9, x + 5, by - 9, x, by, "#d79a52");
    px(x - 3, by - 6, 1, 1, "#b57a38"); px(x + 2, by - 4, 1, 1, "#b57a38");
    ellO(x - 2, by - 12, 5, 4, MINT, INK);
    ellO(x + 3, by - 13, 5, 4, "#ffc2d8", INK);
    ellO(x, by - 17, 5, 4, "#fff0b0", INK);
    disc(x, by - 21, 2, "#e04a5f");
  } else if (kind === "pudding") {
    tri(x - 7, by, x + 7, by, x + 5, by - 11, INK);
    px(x - 7, by - 11, 14, 12, INK);
    px(x - 6, by - 10, 12, 10, "#f6d98a");
    px(x - 5, by - 11, 10, 3, "#b06a2c");
    px(x - 5, by - 8, 2, 3, "#b06a2c"); px(x + 2, by - 8, 2, 2, "#b06a2c");
    px(x - 4, by - 6, 3, 2, "#fbe9b8");
    disc(x, by - 14, 2, "#e04a5f");
  } else if (kind === "cake") {
    tri(x - 8, by, x + 8, by, x + 8, by - 14, INK);
    tri(x - 7, by, x + 7, by, x + 7, by - 12, CREAM);
    px(x - 2, by - 5, 9, 2, "#ff8fb1");
    px(x + 1, by - 9, 6, 2, "#ff8fb1");
    px(x - 6, by - 2, 13, 1, "#e8cfa8");
    disc(x + 4, by - 16, 3, "#e04a5f");
    px(x + 4, by - 19, 1, 2, "#4a8f3a");
    px(x + 3, by - 17, 1, 1, CREAM);
  } else if (kind === "macaron") {
    ellO(x, by - 4, 7, 4, "#c9a7e8", INK);
    ellO(x, by - 11, 7, 4, "#c9a7e8", INK);
    px(x - 6, by - 8, 13, 3, INK);
    px(x - 6, by - 8, 13, 2, "#fff0b0");
    px(x - 5, by - 13, 6, 1, "#e0c9f5");

  } else if (kind === "salmon") {          // 熊的最愛：一整條鮭魚
    tri(x - 11, by - 10, x - 11, by - 1, x - 5, by - 6, INK);      // 尾鰭
    tri(x - 10, by - 9, x - 10, by - 2, x - 6, by - 6, "#e8734f");
    ellO(x + 1, by - 6, 9, 5, "#f2825e", INK);                     // 身體
    ell(x + 1, by - 8, 8, 2, "#c9553a");                           // 背
    ell(x + 2, by - 4, 6, 2, "#ffd0b8");                           // 白肚
    px(x - 4, by - 7, 9, 1, "#ffb090");                            // 側線
    tri(x - 1, by - 10, x + 4, by - 10, x + 1, by - 14, INK);      // 背鰭
    tri(x, by - 10, x + 3, by - 10, x + 1, by - 13, "#e8734f");
    px(x + 7, by - 8, 2, 2, INK);                                  // 眼
    px(x + 7, by - 8, 1, 1, CREAM);
    px(x + 9, by - 6, 1, 2, "#c9553a");

  } else if (kind === "honey") {           // 蜂蜜罐
    px(x - 7, by - 12, 14, 13, INK);
    px(x - 6, by - 11, 12, 11, "#e8c48a");
    px(x - 6, by - 11, 12, 4, "#f5a623");                          // 蜜
    px(x - 6, by - 7, 12, 1, "#d98e12");
    px(x - 8, by - 15, 16, 4, INK);
    px(x - 7, by - 14, 14, 2, "#a8794f");                          // 木蓋
    px(x + 2, by - 7, 2, 4, "#f5a623");                            // 流下來的蜜
    px(x + 2, by - 3, 2, 2, "#ffc75a");
    const bz = Math.round(Math.sin(state.t / 160) * 3);            // 繞著飛的蜜蜂
    px(x - 9 + bz, by - 19, 2, 2, BUTTER);
    px(x - 9 + bz, by - 19, 1, 2, "#3a2a12");
    px(x - 10 + bz, by - 20, 1, 1, "rgba(255,255,255,.7)");

  } else if (kind === "cookie") {          // 巧克力餅乾
    ellO(x, by - 6, 7, 6, "#d9a05b", INK);
    ell(x, by - 8, 6, 3, "#e8b877");
    px(x - 3, by - 8, 2, 2, "#5b3a22");
    px(x + 2, by - 5, 2, 2, "#5b3a22");
    px(x - 1, by - 3, 2, 2, "#5b3a22");
    px(x + 3, by - 10, 2, 2, "#5b3a22");

  } else {                                 // 鯛魚燒
    tri(x - 10, by - 10, x - 10, by - 2, x - 5, by - 6, INK);
    tri(x - 9, by - 9, x - 9, by - 3, x - 6, by - 6, "#c98a3f");
    ellO(x + 1, by - 6, 9, 5, "#d9a05b", INK);
    ell(x + 1, by - 8, 8, 2, "#e8b877");
    px(x - 3, by - 5, 9, 1, "#b57a34");                            // 烤紋
    px(x - 3, by - 3, 7, 1, "#b57a34");
    tri(x, by - 10, x + 4, by - 10, x + 2, by - 13, "#c98a3f");
    px(x + 7, by - 8, 2, 2, INK);
    px(x + 7, by - 8, 1, 1, CREAM);
  }
}

/* 咬痕：用 even-odd 裁切，從熊那一側挖掉一個圓 */
function drawDessertBitten(d, sx) {
  if (d.gone) return;
  if (d.bite <= 0) { drawDessert(d.kind, sx, GROUND_Y + 1); return; }
  ctx.save();
  ctx.beginPath();
  ctx.rect(sx - 24, GROUND_Y - 34, 48, 44);
  ctx.arc(sx - 9, GROUND_Y - 9, 2 + d.bite * 20, 0, Math.PI * 2);
  ctx.clip("evenodd");
  drawDessert(d.kind, sx, GROUND_Y + 1);
  ctx.restore();
}

/* 蛋糕右邊的吉娃娃：坐姿、大立耳、尾巴會搖、可以點
   刻意比熊矮一截（約 20px vs 35px），一眼看得出是小型犬 */
const DOG = "#e9c9a1", DOG_D = "#c39a6d", DOG_L = "#fff4de";
const dog = { hop: 0, bark: 0, sym: 0 };

/* 被點到時冒出來的像素符號 */
const DOG_SYMS = [
  { c: CANDY,  m: [".X.X.", "XXXXX", "XXXXX", ".XXX.", "..X.."] },   // 愛心
  { c: MINT,   m: ["..XX.", "..XX.", "..XX.", "XXXX.", "XXXX."] },   // 音符
  { c: BUTTER, m: ["..X..", ".XXX.", "XXXXX", ".XXX.", ".X.X."] },   // 星星
  { c: "#ff6f91", m: ["..X..", "..X..", "..X..", ".....", "..X.."] } // 驚嘆號
];

function drawSpeechBubble(cx, cy, sym) {
  const s = DOG_SYMS[sym % DOG_SYMS.length];
  const w = 17, h = 15;
  const x = Math.round(cx - w / 2), y = Math.round(cy - h);
  px(x - 1, y - 1, w + 2, h + 2, INK);
  px(x, y, w, h, CREAM);
  px(cx - 2, y + h, 4, 2, INK);          // 泡泡的小尾巴
  px(cx - 1, y + h, 2, 1, CREAM);
  for (let ry = 0; ry < 5; ry++)
    for (let rx = 0; rx < 5; rx++)
      if (s.m[ry][rx] === "X") px(x + 3 + rx * 2, y + 3 + ry * 2, 2, 2, s.c);
}

function drawChihuahua(x, by) {
  x = Math.round(x);
  by = Math.round(by - (dog.hop > 0 ? Math.sin(dog.hop * Math.PI) * 9 : 0));
  // 被點到會搖得比較快
  const wag = Math.sin(state.t / (dog.bark > 0 ? 70 : 190)) * (dog.bark > 0 ? 3 : 2);

  ctx.globalAlpha = .22;
  ell(x + 1, by + (dog.hop > 0 ? Math.sin(dog.hop * Math.PI) * 9 : 0), 9, 2, "#000");
  ctx.globalAlpha = 1;

  // 尾巴（細細地翹起來搖）
  for (let i = 0; i < 6; i++)
    px(x - 7 - i, by - 8 - i + Math.round(wag * (i / 5)), 2, 2, DOG_D);

  // 坐著的後腿與身體
  ellO(x - 3, by - 5, 5, 5, DOG_D, INK);
  ellO(x + 2, by - 8, 5, 6, DOG, INK);
  ell(x + 3, by - 7, 3, 4, DOG_L);                 // 白胸

  // 前腳
  box(x + 2, by - 4, 2, 4, DOG_L, INK);
  box(x + 5, by - 4, 2, 4, DOG_L, INK);

  // 頭（蘋果頭）
  const hy = by - 15;
  ellO(x + 4, hy, 5, 5, DOG, INK);

  // 大立耳
  tri(x - 2, hy - 2, x + 3, hy - 3, x - 1, hy - 10, INK);
  tri(x - 1, hy - 3, x + 2, hy - 4, x, hy - 9, DOG);
  tri(x + 6, hy - 3, x + 11, hy - 2, x + 10, hy - 10, INK);
  tri(x + 7, hy - 4, x + 10, hy - 3, x + 9, hy - 9, DOG);

  // 口鼻與鼻子
  ell(x + 8, hy + 2, 3, 2, DOG_L);
  px(x + 9, hy + 1, 2, 2, "#3a241a");

  // 大眼睛（吉娃娃的招牌）
  const blink = (state.t + 900) % 4200 < 130;
  if (blink) { px(x + 2, hy, 2, 1, INK); px(x + 6, hy, 2, 1, INK); }
  else {
    px(x + 2, hy - 1, 2, 3, INK); px(x + 6, hy - 1, 2, 3, INK);
    px(x + 2, hy - 1, 1, 1, CREAM); px(x + 6, hy - 1, 1, 1, CREAM);
  }

  // 薄荷色項圈，跟熊的粉紅帽子區隔開
  px(x + 1, hy + 5, 8, 2, INK);
  px(x + 1, hy + 5, 8, 1, MINT);
  px(x + 4, hy + 6, 2, 2, BUTTER);

  if (dog.bark > 0) drawSpeechBubble(x + 4, hy - 12, dog.sym);
}

function drawBigCake(x, by) {
  x = Math.round(x); by = Math.round(by);
  ctx.globalAlpha = .22; ell(x, by + 1, 22, 3, "#000"); ctx.globalAlpha = 1;
  px(x - 20, by - 12, 40, 12, INK); px(x - 19, by - 11, 38, 11, "#f6dcb0");
  px(x - 19, by - 11, 38, 2, "#ff8fb1");
  px(x - 15, by - 24, 30, 12, INK); px(x - 14, by - 23, 28, 11, CREAM);
  px(x - 14, by - 23, 28, 2, "#ffc2d8");
  px(x - 10, by - 34, 20, 10, INK); px(x - 9, by - 33, 18, 9, "#f6dcb0");
  px(x - 9, by - 33, 18, 2, MINT);
  for (let i = -1; i <= 1; i++) {
    const cxp = x + i * 6;
    px(cxp, by - 41, 2, 8, "#ff8fb1");
    const f = Math.sin(state.t / 130 + i * 2) > 0 ? 0 : 1;
    px(cxp, by - 45 - f, 2, 3, BUTTER);
    px(cxp, by - 46 - f, 2, 1, "#fff0b0");
    ctx.globalAlpha = .3; disc(cxp + 1, by - 44 - f, 4, BUTTER); ctx.globalAlpha = 1;
  }
  for (let i = 0; i < 5; i++) disc(x - 16 + i * 8, by - 13, 2, "#e04a5f");
}

/* ==================================================================
   ⑧  信封 / 卡片
   ================================================================== */
/* 「一封信」階段的底：深色桌面 + 一圈暖光，讓信是唯一的主角 */
function drawBackdrop(a) {
  if (a <= 0) return;
  ctx.globalAlpha = a;
  px(0, 0, W, H, "#101f26");                       // 深青的桌面
  const cx = Math.round(W / 2), cy = Math.round(H * 0.52);
  for (let i = 6; i >= 1; i--) {
    ctx.globalAlpha = a * 0.055;
    ell(cx, cy, Math.round(W * 0.13 * i), Math.round(H * 0.11 * i), "#a8794f");  // 暖色燈光
  }
  _seed = 4242;                                   // 幾顆會呼吸的微光
  for (let i = 0; i < 18; i++) {
    const sx = Math.round(rnd() * W), sy = Math.round(rnd() * H);
    ctx.globalAlpha = a * (0.12 + 0.26 * (0.5 + 0.5 * Math.sin(state.t / 760 + i * 1.7)));
    px(sx, sy, 1, 1, "#ffe6b8");
  }
  ctx.globalAlpha = 1;
}

/* layer: "back" = 紙身＋內襯＋掀起的封口（畫在卡片後面）
          "front" = 前口袋＋摺線＋郵票（畫在卡片前面，卡片才像插在裡面）
          "all"   = 信封關著的樣子
   尺寸用參數傳，才能隨畫面大小放大成「整頁就是一封信」 */
function drawEnvelope(cx, cy, w, h, flap, sealOn, layer) {
  layer = layer || "all";
  w = Math.round(w); h = Math.round(h);
  cx = Math.round(cx);
  const x = Math.round(cx - w / 2), y = Math.round(cy - h / 2);
  const pocket = y + Math.round(h * 0.39);
  const lip = Math.max(2, Math.round(h * 0.045));

  if (layer !== "front") {
    // 桌面上的影子
    ctx.globalAlpha = .3;
    ell(cx, y + h + Math.round(h * 0.06), Math.round(w * 0.52), Math.max(2, Math.round(h * 0.05)), "#0d0718");
    ctx.globalAlpha = 1;
    box(x, y, w, h, "#fff4de", INK);
    if (flap > 0.05) px(x + 1, y + 1, w - 2, Math.round(h * 0.39), "#8f6f9c");   // 內襯
  }

  if (layer !== "back") {
    px(x - 1, pocket - 1, w + 2, y + h - pocket + 2, INK);      // 前口袋
    px(x, pocket, w, y + h - pocket, "#f9ebcc");
    px(x, y + h - lip, w, lip, "#e8d3ae");
    ctx.strokeStyle = "#e0c9a4"; ctx.lineWidth = 1;             // 摺線
    ctx.beginPath();
    ctx.moveTo(x + .5, y + h - .5); ctx.lineTo(cx, pocket + Math.round(h * 0.22));
    ctx.lineTo(x + w - .5, y + h - .5); ctx.stroke();
    // 郵票：小熊頭
    const sw = Math.max(14, Math.round(w * 0.155)), sm = Math.round(w * 0.055);
    const px0 = x + w - sw - sm, py0 = y + h - sw - sm;
    px(px0, py0, sw, sw, "#f2dfba");
    px(px0 + 1, py0 + 1, sw - 2, sw - 2, "#ffd7e6");
    const sx = Math.round(px0 + sw / 2), sy = Math.round(py0 + sw / 2);
    const er = Math.max(2, Math.round(sw * 0.15));
    disc(sx - er * 2, sy - er * 2, er, BEAR_D); disc(sx + er * 2, sy - er * 2, er, BEAR_D);
    disc(sx, sy, Math.round(sw * 0.3), BEAR);
    px(sx - er, sy - er, er, er, INK); px(sx + er, sy - er, er, er, INK);
    px(sx, sy + er, er, Math.max(1, er - 1), "#4a2f22");
  }

  if (layer !== "front") {
    const apexY = y + h * 0.62 - flap * (h * 0.62 + h * 0.45);  // 封口
    tri(x, y, x + w, y, cx, apexY, INK);
    tri(x + 1, y + 1, x + w - 1, y + 1, cx, apexY - 1.5, flap > .5 ? "#e8d3ae" : "#f5e3c0");
  }

  if (sealOn && layer !== "back") {
    const r = Math.max(7, Math.round(w * 0.075));
    const sy = y + Math.round(h * 0.56);
    disc(cx, sy, r, "#d94f76");
    disc(cx, sy, r - 2, CANDY);
    // 愛心：5×5 的像素圖樣，小尺寸也認得出來
    const u = Math.max(1, Math.round(r / 5));
    const hx0 = cx - Math.round(u * 2.5), hy0 = sy - Math.round(u * 2.5);
    const HEART = [".X.X.", "XXXXX", "XXXXX", ".XXX.", "..X.."];
    for (let ry = 0; ry < 5; ry++)
      for (let rx = 0; rx < 5; rx++)
        if (HEART[ry][rx] === "X") px(hx0 + rx * u, hy0 + ry * u, u, u, "#fff4de");
  }
}

/* 折好的卡片，open 0→1 = 封面往左掀開 */
function drawCard(cx, cy, w, h, open, ribbon) {
  w = Math.round(w); h = Math.round(h);
  cx = Math.round(cx);
  const x = Math.round(cx - w / 2), y = Math.round(cy - h / 2);
  const k = w / 94;                                  // 相對基準尺寸的縮放
  const R = v => Math.max(1, Math.round(v * k));

  // 內頁
  box(x, y, w, h, "#fffaf0", INK);
  if (open > 0.02) {
    ctx.globalAlpha = open * .45;
    px(x, y, w, h, "#fff8d8");                       // 內頁光暈
    ctx.globalAlpha = Math.min(1, open * 1.8);
    for (let i = 0; i < 4; i++)
      px(x + R(10), y + Math.round(h * 0.25) + i * Math.round(h * 0.14),
         Math.round((w - R(28)) * (0.55 + (i % 3) * 0.15)), Math.max(2, R(2)), "#e2cdae");
    disc(x + w - R(17), y + Math.round(h * 0.27), R(4), CANDY);
    ctx.globalAlpha = 1;
  }

  // 封面：寬度從整張縮到 0，靠左邊當轉軸
  const cw = Math.round(w * (1 - open));
  if (cw > 1) {
    px(x - 1, y - 1, cw + 2, h + 2, INK);
    px(x, y, cw, h, "#f2dfba");
    px(x + cw - 2, y, 2, h, "#d9c29a");              // 封面右緣
    if (open < 0.42) {
      const bcx = Math.round(x + cw / 2), bcy = y + Math.round(h * 0.38);
      ctx.globalAlpha = 1 - open / 0.42;
      disc(bcx - R(6), bcy - R(9), R(3), BEAR_D); disc(bcx + R(6), bcy - R(9), R(3), BEAR_D);
      disc(bcx, bcy - R(4), R(8), BEAR);
      px(bcx - R(4), bcy - R(6), R(2), R(2), INK); px(bcx + R(3), bcy - R(6), R(2), R(2), INK);
      ell(bcx + R(1), bcy - R(1), R(4), R(3), BEAR_L);
      px(bcx, bcy - R(2), R(2), Math.max(1, R(1)), "#4a2f22");
      px(bcx - R(9), bcy - R(4), R(2), R(1), CANDY); px(bcx + R(8), bcy - R(4), R(2), R(1), CANDY);
      ctx.globalAlpha = 1;
    }
  }

  if (ribbon > 0) {
    const ry = y + Math.round(h * 0.74);       // 緞帶壓在下方，不擋住熊的臉
    const bh = Math.max(5, Math.round(h * 0.11));
    const br = Math.max(4, Math.round(w * 0.065));
    ctx.globalAlpha = ribbon;
    px(x - 1, ry - Math.round(bh / 2) - 1, w + 2, bh + 2, "#d94f76");
    px(x, ry - Math.round(bh / 2), w, bh, CANDY);
    disc(cx, ry, br, "#d94f76");
    disc(cx - br, ry - 1, Math.round(br * .7), CANDY);
    disc(cx + br, ry - 1, Math.round(br * .7), CANDY);
    px(cx - 1, ry - 1, 2, 2, "#fff4de");
    ctx.globalAlpha = 1;
  }
}

/* ==================================================================
   ⑨  粒子
   ================================================================== */
function spawnCrumbs(x, y) {
  for (let i = 0; i < 9; i++)
    crumbs.push({ x, y, vx: (Math.random() - .5) * 40, vy: -20 - Math.random() * 40,
                  c: Math.random() < .5 ? BUTTER : CANDY, life: 700 });
}
function spawnConfetti(n) {
  for (let i = 0; i < n; i++)
    confetti.push({ x: Math.random() * W, y: -Math.random() * 60,
      vx: (Math.random() - .5) * 16, vy: 22 + Math.random() * 34,
      c: BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)],
      s: 1 + Math.round(Math.random() * 1.4), ph: Math.random() * 6.3 });
}
function spawnHearts(wx, wy) {
  for (let i = 0; i < 7; i++)
    crumbs.push({ x: wx + (Math.random() - .5) * 10, y: wy,
      vx: (Math.random() - .5) * 18, vy: -26 - Math.random() * 24,
      c: i % 2 ? CANDY : "#ff6f91", life: 900 });
}
function spawnFirework() {
  const x = 26 + Math.random() * (W - 52);
  const y = 16 + Math.random() * 58;
  const cs = BALLOON_COLORS;
  const c1 = cs[Math.floor(Math.random() * cs.length)];
  const c2 = cs[Math.floor(Math.random() * cs.length)];
  fireworks.push({ x, y, flash: 1 });
  const n = 18 + Math.floor(Math.random() * 10);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * .25;
    const sp = 17 + Math.random() * 28;
    fwParts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                   c: i % 3 === 0 ? c2 : c1, life: 900 + Math.random() * 520, t: 0 });
  }
}
function stepParticles(dt) {
  crumbs = crumbs.filter(p => {
    p.life -= dt; p.vy += 180 * dt / 1000;
    p.x += p.vx * dt / 1000; p.y += p.vy * dt / 1000;
    if (p.life <= 0) return false;
    px(p.x - state.camX, p.y, 1, 1, p.c);
    return true;
  });
  confetti = confetti.filter(p => {
    p.y += p.vy * dt / 1000; p.x += p.vx * dt / 1000;
    if (p.y > H + 6) return false;
    const w = Math.abs(Math.sin(state.t / 200 + p.ph)) * p.s + 1;
    px(p.x, p.y, w, p.s, p.c);
    return true;
  });
  fireworks = fireworks.filter(f => {            // 爆開瞬間的白光
    f.flash -= dt / 170;
    if (f.flash <= 0) return false;
    ctx.globalAlpha = Math.max(0, f.flash) * .9;
    disc(f.x, f.y, 3 + (1 - f.flash) * 6, "#fff8e4");
    ctx.globalAlpha = 1;
    return true;
  });
  fwParts = fwParts.filter(p => {                // 四散的火花，帶一點重力和尾巴
    p.t += dt;
    if (p.t > p.life) return false;
    p.vy += 30 * dt / 1000;
    p.vx *= 1 - 0.55 * dt / 1000;
    p.x += p.vx * dt / 1000;
    p.y += p.vy * dt / 1000;
    const k = 1 - p.t / p.life;
    ctx.globalAlpha = Math.max(0, k);
    const sz = k > .55 ? 2 : 1;
    px(p.x, p.y, sz, sz, p.c);
    if (k > .3) { ctx.globalAlpha = k * .45; px(p.x - p.vx * .014, p.y - p.vy * .014, 1, 1, p.c); }
    ctx.globalAlpha = 1;
    return true;
  });
}

/* ==================================================================
   ⑩  主迴圈
   ================================================================== */
let last = 0;
function loop(ts) {
  const dt = Math.min(48, ts - last) || 16;
  last = ts; state.t = ts; state.at += dt;
  update(dt);
  render(dt);
  requestAnimationFrame(loop);
}

function update(dt) {
  const s = state;

  if (s.scene === "letterOut") {
    if (s.at > 2500 * spd) showGate2();
  }

  if (s.scene === "opening") {
    const p = s.at / (3400 * spd);
    if (p > .30 && balloons.length < balloonMax()) for (let i = 0; i < 4; i++) addBalloon(false, true);
    if (p >= 1) startWalk();
  }

  if (s.scene === "walk") {
    if (s.mode === "ready") {                 // 站著等玩家點畫面
      bear.mood = "idle";
    } else if (s.mode === "stuck") {           // 走不動了，等人推
      bear.mood = "stuck";
    } else if (s.mode === "walking") {
      const target = desserts[s.idx].x - 23;   // 站遠一點，甜點才不會被熊擋住
      if (bear.push > 0) bear.push = Math.max(0, bear.push - dt / 520);
      const speed = 62 * (RM ? 2.2 : 1) * (1 + bear.push * 1.5);
      bear.x = Math.min(target, bear.x + speed * dt / 1000);
      bear.phase += dt / 1000 * 7.5 * (1 + bear.push);
      bear.mood = "idle";
      if (s.stuckAt !== null && bear.x >= s.stuckAt) {
        s.stuckAt = null; s.mode = "stuck"; sfx("err");
        showSceneDialog("大棕熊走不動了，推我一下！");
      } else if (bear.x >= target - 0.4) { s.mode = "eating"; s.at = 0; sfx("chomp"); }
    } else if (s.mode === "eating") {
      const d = desserts[s.idx];
      const dur = 1250 * spd;
      d.bite = clamp(s.at / dur, 0, 1);
      bear.mood = "eat";
      if (s.at > dur * .35 && s.at - dt <= dur * .35) spawnCrumbs(d.x - 6, GROUND_Y - 8);
      if (s.at > dur * .7 && s.at - dt <= dur * .7) { spawnCrumbs(d.x - 4, GROUND_Y - 6); sfx("chomp"); }
      if (s.at >= dur) { d.gone = true; s.mode = "wish"; s.at = 0; bear.hop = 1; showWish(s.idx); }
    } else if (s.mode === "wish") {
      bear.mood = "happy";
    }
    if (bear.hop > 0) bear.hop = Math.max(0, bear.hop - dt / 420);
    s.camX = clamp(bear.x - CAM_LEAD, 0, CAM_MAX);
  }

  if (s.scene === "finale") {
    // 結尾把鏡頭平順地帶到「熊 + 蛋糕 + 吉娃娃」的正中間
    const camTarget = clamp(FINALE_CX - W / 2, 0, CAM_MAX);
    s.camX += (camTarget - s.camX) * Math.min(1, dt / 520);

    if (s.mode === "toCake") {
      bear.x = Math.min(BEAR_END_X, bear.x + 66 * dt / 1000);
      bear.phase += dt / 1000 * 7.5;
      bear.mood = "idle";
      if (bear.x >= BEAR_END_X - 0.4) { s.mode = "celebrate"; s.at = 0; spawnConfetti(RM ? 20 : 70); sfx("fanfare"); showEnd(); }
    } else if (s.mode === "celebrate") {
      bear.mood = "happy";
      if (!RM && confetti.length < 40) spawnConfetti(6);
      if (!RM && Math.random() < dt / 430) spawnFirework();
      if (balloons.length < balloonMax()) addBalloon(false);
    }
    if (bear.hop > 0) bear.hop = Math.max(0, bear.hop - dt / 420);
  }

  if (dog.hop > 0) dog.hop = Math.max(0, dog.hop - dt / 380);
  if (dog.bark > 0) dog.bark = Math.max(0, dog.bark - dt / 1100);

  // 胖度平滑跟上：吃完一個會看到牠慢慢鼓起來，而不是瞬間變形
  if (s.scene === "walk" || s.scene === "finale") {
    const target = fatness();
    bear.fat += (target - bear.fat) * Math.min(1, dt / 300);
  }

  if (skyFade < 1) skyFade = Math.min(1, skyFade + dt / 620);

  // 鏡頭上下平移，讓對話框有位置又不擋到熊
  s.camY += (s.camYTarget - s.camY) * Math.min(1, dt / 200);
  if (Math.abs(s.camYTarget - s.camY) < 0.4) s.camY = s.camYTarget;

  if (s.flash > 0) s.flash = Math.max(0, s.flash - dt / (420 * spd));
}

function render(dt) {
  const s = state;
  ctx.clearRect(0, 0, W, H);

  // 前三個場景是「一封信」，完全不畫世界
  const letter = s.scene === "gate1" || s.scene === "letterOut" || s.scene === "gate2";

  if (!letter) {
    ctx.save();
    ctx.translate(0, Math.round(s.camY));      // 世界整體上移，讓出對話框的位置
    drawSky();
    drawClouds();
    if (s.scene === "walk" || s.scene === "finale") drawBunting();
    drawBalloons(dt);
    drawHills();
    drawGround();
    if (s.scene === "walk" || s.scene === "finale") drawButterflies();

    // 背景先壓暗，人物等一下只壓一點點，才不會整片黑成一團
    const nt = night();
    tintScreen(nt * 0.5);

    if (s.scene === "walk" || s.scene === "finale") {
      if (nt > 0.12) {                      // 腳下的暖光
        warmPool(bear.x - s.camX, GROUND_Y - 5, 36, nt);
        const cx0 = CAKE_X - s.camX;
        if (cx0 > -60 && cx0 < W + 60) warmPool(cx0, GROUND_Y - 6, 52, nt * 1.35);
      }
      desserts.forEach((d, i) => {          // 甜點 + 大蛋糕
        const sx = d.x - s.camX;
        if (sx < -24 || sx > W + 24) return;
        if (i === s.idx && s.mode === "eating") drawDessertBitten(d, sx);
        else if (!d.gone) drawDessert(d.kind, sx, GROUND_Y + 1);
      });
      const cakeSx = CAKE_X - s.camX;
      if (cakeSx > -46 && cakeSx < W + 46) drawBigCake(cakeSx, GROUND_Y + 1);
      const dogSx = DOG_X - s.camX;
      if (dogSx > -24 && dogSx < W + 24) drawChihuahua(dogSx, GROUND_Y + 1);

      const lift = bear.hop > 0 ? Math.sin(bear.hop * Math.PI) * 12 : 0;
      drawBear(bear.x - s.camX, GROUND_Y,
               { walk: bear.phase, mood: bear.mood, lift, fat: bear.fat });

      tintScreen(nt * 0.14);                // 人物只跟著暗一點點
    }
    ctx.restore();
  }

  // 信的底色；卡片打開時淡出，世界才浮現
  if (letter) drawBackdrop(1);
  else if (s.scene === "opening")
    drawBackdrop(1 - clamp((s.at / (3400 * spd) - 0.14) / 0.34, 0, 1));

  // 場景道具
  if (s.scene === "gate1") {
    const bob = Math.sin(s.t / 700) * 2;
    drawEnvelope(ENV_CX, ENV_CY + bob, ENV_W, ENV_H, 0, true);
  } else if (s.scene === "letterOut") {
    const p = clamp(s.at / (2500 * spd), 0, 1);
    const flap  = clamp(p / 0.26, 0, 1);
    const rise  = clamp((p - 0.24) / 0.44, 0, 1);
    const drop  = clamp((p - 0.66) / 0.34, 0, 1);
    const envY  = ENV_CY + easeOut(drop) * (H * 1.15);
    // 蠟印彈開飛走
    if (p < 0.32) {
      const q = p / 0.32;
      ctx.globalAlpha = 1 - q;
      disc(ENV_CX + q * W * 0.22, ENV_CY + ENV_H * 0.06 - q * H * 0.22 + q * q * H * 0.4,
           Math.max(5, Math.round(ENV_W * 0.06)), CANDY);
      ctx.globalAlpha = 1;
    }
    // 信封後半 → 卡片 → 信封前口袋，卡片才像從裡面被抽出來
    const cyIn = ENV_CY + ENV_H * 0.16, cyOut = ENV_CY - ENV_H * 0.44, cyRest = H / 2;
    drawEnvelope(ENV_CX, envY, ENV_W, ENV_H, flap, false, "back");
    if (rise > 0)
      drawCard(ENV_CX,
               cyIn + (cyOut - cyIn) * easeOut(rise) + (cyRest - cyOut) * easeOut(drop),
               CRD_W, CRD_H, 0, 1);
    drawEnvelope(ENV_CX, envY, ENV_W, ENV_H, flap, false, "front");
  } else if (s.scene === "gate2") {
    const bob = Math.sin(s.t / 700) * 2;
    drawCard(ENV_CX, H / 2 + bob, CRD_W, CRD_H, 0, 1);
  } else if (s.scene === "opening") {
    const p = clamp(s.at / (3400 * spd), 0, 1);
    const ribbon = clamp(1 - p / 0.16, 0, 1);
    const open   = clamp((p - 0.18) / 0.34, 0, 1);
    const grow   = clamp((p - 0.60) / 0.30, 0, 1);
    // 蝴蝶結飛走
    if (p < 0.3 && p > 0.05) {
      const q = (p - .05) / .25;
      ctx.globalAlpha = 1 - q;
      px(ENV_CX - CRD_W * 0.35 - q * 40, H / 2 + q * q * 90, 12, 4, CANDY);
      px(ENV_CX + CRD_W * 0.25 + q * 40, H / 2 + q * q * 70, 12, 4, "#d94f76");
      ctx.globalAlpha = 1;
    }
    ctx.save();
    ctx.translate(W / 2, H / 2 + ease(grow) * H * 0.06);
    const sc = 1 + ease(grow) * 1.9;
    ctx.scale(sc, sc);
    drawCard(0, 0, CRD_W, CRD_H, open, ribbon);
    ctx.restore();
    // 從卡片裡灑出來的光
    if (open > .4) {
      ctx.globalAlpha = (open - .4) / .6 * .38 * (1 - grow);
      for (let a = 0; a < 10; a++) {
        const an = a * Math.PI / 5 + s.t / 2600;
        tri(W / 2, H / 2, W / 2 + Math.cos(an) * 190, H / 2 + Math.sin(an) * 190,
                          W / 2 + Math.cos(an + .11) * 190, H / 2 + Math.sin(an + .11) * 190, "#fff8d8");
      }
      ctx.globalAlpha = 1;
    }
    if (grow > .82) { ctx.globalAlpha = (grow - .82) / .18; px(0, 0, W, H, "#fff8e4"); ctx.globalAlpha = 1; }
  }

  stepParticles(dt);

  if (s.flash > 0) { ctx.globalAlpha = s.flash * .85; px(0, 0, W, H, "#fff8e4"); ctx.globalAlpha = 1; }
}

/* ==================================================================
   ⑪  音樂與音效（全部用 WebAudio 現場合成，沒有外部檔案）
   ================================================================== */
let actx = null, musicGain = null, sfxGain = null, noiseBuf = null;
let soundOn = true, bgmOn = false, bgmTimer = null, bgmIndex = 0, bgmNextTime = 0;

const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function noteHz(n) {
  const m = /^([A-G])(#?)(\d)$/.exec(n);
  if (!m) return 0;
  const midi = (parseInt(m[3], 10) + 1) * 12 + SEMI[m[1]] + (m[2] ? 1 : 0);
  return 440 * Math.pow(2, (midi - 69) / 12);
}
const seq = s => s.trim().split(/\s+/);

/* 8 小節循環，和弦走 C - Am - F - G（兩輪，第二輪旋律有變化） */
const BGM_BPM = 132;
const LEAD = seq(`
  E5 G5 C6 G5 E5 G5 E5 D5   C5 E5 A5 E5 C5 E5 D5 C5
  F5 A5 C6 A5 F5 A5 G5 F5   D5 G5 B5 G5 D5 F5 E5 D5
  C6 .  B5 G5 E5 .  G5 .    A5 .  C6 A5 E5 .  A5 .
  F5 G5 A5 C6 A5 G5 F5 E5   D5 E5 F5 G5 B5 .  .  .
`);
const BASS = seq(`
  C3 . G2 . C3 . G2 .   A2 . E2 . A2 . E2 .
  F2 . C3 . F2 . C3 .   G2 . D3 . G2 . D3 .
  C3 . G2 . C3 . G2 .   A2 . E2 . A2 . E2 .
  F2 . C3 . F2 . C3 .   G2 . D3 . G3 . G2 .
`);
const ARP = seq(`
  . E4 . G4 . E4 . G4   . C4 . E4 . C4 . E4
  . A4 . C5 . A4 . C5   . B4 . D5 . B4 . D5
  . E4 . G4 . E4 . G4   . C4 . E4 . C4 . E4
  . A4 . C5 . A4 . C5   . B4 . D5 . B4 . D5
`);

function ensureAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { actx = new AC(); } catch (e) { return false; }
    musicGain = actx.createGain(); musicGain.gain.value = 0; musicGain.connect(actx.destination);
    sfxGain = actx.createGain(); sfxGain.gain.value = 0.9; sfxGain.connect(actx.destination);
    const n = actx.sampleRate * 0.6;
    noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  }
  if (actx.state === "suspended") actx.resume();
  return true;
}

function tone(hz, t, dur, type, vol, dest) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(hz, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.setValueAtTime(vol, t + dur * 0.55);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest);
  o.start(t); o.stop(t + dur + 0.03);
}
function hit(t, dur, vol, hp) {                    // 打擊：白噪音
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp;
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(musicGain);
  s.start(t); s.stop(t + dur + 0.02);
}
function kick(t) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(48, t + 0.11);
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
  o.connect(g); g.connect(musicGain);
  o.start(t); o.stop(t + 0.17);
}

function musicLevel() {
  if (!soundOn) return 0;
  // 解謎階段小聲一點，卡片打開後整首放開
  return (state.scene === "walk" || state.scene === "finale") ? 0.17 : 0.10;
}
function playBgmStep(i, t) {
  const sd = 60 / BGM_BPM / 2;                     // 一格 = 8 分音符
  const full = state.scene === "walk" || state.scene === "finale";
  if (LEAD[i] !== ".") tone(noteHz(LEAD[i]), t, sd * 0.92, "square", 0.085, musicGain);
  if (BASS[i] !== ".") tone(noteHz(BASS[i]), t, sd * 1.5, "triangle", 0.17, musicGain);
  if (!full) return;
  if (ARP[i] !== ".") tone(noteHz(ARP[i]), t, sd * 0.45, "square", 0.032, musicGain);
  const b = i % 8;
  hit(t, 0.035, b % 2 === 0 ? 0.075 : 0.04, 7000);            // hi-hat
  if (b === 0 || b === 4) kick(t);
  if (b === 2 || b === 6) hit(t, 0.10, 0.16, 1600);           // snare
}
function bgmTick() {
  if (!actx) return;
  const sd = 60 / BGM_BPM / 2;
  musicGain.gain.setTargetAtTime(musicLevel(), actx.currentTime, 0.25);
  while (bgmNextTime < actx.currentTime + 0.15) {
    playBgmStep(bgmIndex, Math.max(bgmNextTime, actx.currentTime + 0.01));
    bgmNextTime += sd;
    bgmIndex = (bgmIndex + 1) % LEAD.length;
  }
}
function startBgm() {
  if (bgmOn || !soundOn) return;
  if (!ensureAudio()) return;
  bgmOn = true;
  bgmIndex = 0;
  bgmNextTime = actx.currentTime + 0.1;
  bgmTimer = setInterval(bgmTick, 45);
  bgmTick();
}
function stopBgm() {
  if (musicGain && actx) musicGain.gain.setTargetAtTime(0, actx.currentTime, 0.12);
  clearInterval(bgmTimer);
  bgmTimer = null; bgmOn = false;
}

/* 瀏覽器規定要有使用者動作才能出聲，所以第一次互動時才真正開始 */
["pointerdown", "keydown"].forEach(ev =>
  addEventListener(ev, () => { if (soundOn) startBgm(); }, { passive: true }));

function sfx(kind) {
  if (!soundOn || !ensureAudio()) return;
  const notes = {
    key:     [[660, 0, .06]],
    err:     [[180, 0, .12], [140, .1, .16]],
    unlock:  [[523, 0, .1], [659, .09, .1], [784, .18, .14]],
    chomp:   [[210, 0, .05], [150, .05, .07]],
    bark:    [[880, 0, .05], [1180, .05, .05], [740, .12, .07]],
    push:    [[300, 0, .07], [420, .06, .07], [620, .13, .1]],
    fanfare: [[523,0,.12],[659,.11,.12],[784,.22,.12],[1046,.33,.2],
              [784,.55,.12],[1046,.66,.3]]
  }[kind] || [];
  notes.forEach(([f, t, d]) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "square"; o.frequency.value = f;
    const t0 = actx.currentTime + t;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.09, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(sfxGain);
    o.start(t0); o.stop(t0 + d + .02);
  });
}

/* ==================================================================
   ⑫  介面與流程
   ================================================================== */
const el = id => document.getElementById(id);
const panels = { gate: el("panelGate"), wait: el("panelWait"), end: el("panelEnd") };
/* name 傳 "none" 就全部收起來，螢幕可以吃掉整個高度 */
function showPanel(name) {
  Object.keys(panels).forEach(k => panels[k].hidden = k !== name);
  layout();          // 面板高度變了，螢幕比例要跟著調
}

/* ---- 場景內的對話框 ---- */
function showSceneDialog(text, opts) {
  opts = opts || {};
  el("sceneText").textContent = text;
  const t = el("sceneTitle");
  t.hidden = !opts.title;
  if (opts.title) t.textContent = opts.title;
  el("sceneHint").hidden = true;
  el("sceneDialog").hidden = false;
  el("sceneNext").hidden = !!opts.last;
  const box = el("sceneDialog");
  box.setAttribute("aria-disabled", opts.last ? "true" : "false");
  box.setAttribute("aria-label", opts.last ? text : text + "（點一下繼續）");
  el("sceneUI").hidden = false;
  measureDialog();
  if (!opts.last) box.focus({ preventScroll: true });
}
/* 小提示條：要玩家點一下畫面 */
function showSceneHint(text) {
  el("sceneDialog").hidden = true;
  el("sceneHintText").textContent = text;
  const h = el("sceneHint");
  h.hidden = false;
  h.setAttribute("aria-label", text);
  el("sceneUI").hidden = false;
  measureDialog();
  h.focus({ preventScroll: true });
}
function hideSceneDialog() {
  el("sceneUI").hidden = true;
  el("sceneHint").hidden = true;
  el("sceneDialog").hidden = false;
  state.camYTarget = 0;
}
/* 量出對話框在畫布座標系裡的高度，鏡頭才知道要往上讓多少 */
function measureDialog() {
  const ui = el("sceneUI");
  if (ui.hidden) { state.camYTarget = 0; return; }
  const r = cv.getBoundingClientRect();
  if (!r.height) { state.camYTarget = 0; return; }
  const dh = ui.getBoundingClientRect().height * (H / r.height);
  state.camYTarget = Math.min(0, (H - dh) - GROUND_Y - 7);   // 留一點空隙，熊才不會貼在框上
}

/* ---- 依螢幕可用空間決定畫面的邏輯寬度 ----
   高度不夠就把畫面拉寬（比較扁），高度充裕就變窄（像素變大）。 */
const cabinetEl = document.querySelector(".cabinet");
const bezelEl   = document.querySelector(".bezel");

function layout() {
  const bz = getComputedStyle(bezelEl);
  const padX = parseFloat(bz.paddingLeft) + parseFloat(bz.paddingRight);
  const availW = Math.max(140, bezelEl.clientWidth - padX);

  const bd = getComputedStyle(document.body);
  const padY = parseFloat(bd.paddingTop) + parseFloat(bd.paddingBottom);
  const chromeH = Math.max(0, cabinetEl.offsetHeight - bezelEl.offsetHeight);
  const availH = Math.max(110, window.innerHeight - chromeH - padY - 26);

  let w = Math.ceil(availW * H / availH);
  w = Math.round(clamp(w, 200, 384) / 2) * 2;

  if (w !== W) {
    W = w;
    cv.width = W; cv.height = H;        // 改尺寸會重置 context
    ctx.imageSmoothingEnabled = false;
    applyMetrics();
    if (balloons.length) refillBalloons();
    state.camX = clamp(state.camX, 0, CAM_MAX);
  }
  cv.style.aspectRatio = W + " / " + H;
  // 高度真的塞不下時（例如橫躺的手機），再用寬度把它縮回來
  el("screenWrap").style.maxWidth = Math.floor(Math.min(availW, availH * W / H)) + "px";
  measureDialog();          // 螢幕大小變了，對話框佔的比例也變了
}

let lastVW = 0;
addEventListener("resize", () => {
  const vw = window.innerWidth;
  // 手機鍵盤彈出只會改高度，這時候不要重排，不然畫面會跳
  if (vw === lastVW && document.activeElement === el("codeInput")) return;
  lastVW = vw;
  layout();
});
addEventListener("orientationchange", () => setTimeout(layout, 260));

/* 手繪 3×5 像素數字 */
const DIGITS = {
  "0": "111101101101111", "1": "010010010010010", "2": "111001111100111",
  "3": "111001111001111", "4": "101101111001001", "5": "111100111001111",
  "6": "111100111101111", "7": "111001001001001", "8": "111101111101111",
  "9": "111101111001111"
};
function renderSlots() {
  const v = el("codeInput").value;
  const box = el("slots");
  box.innerHTML = "";
  for (let i = 0; i < 4; i++) {
    const slot = document.createElement("div");
    slot.className = "slot" + (i === Math.min(v.length, 3) && v.length < 4 ? " active" : "");
    if (v[i]) {
      const g = document.createElement("div");
      g.className = "pxd";
      const map = DIGITS[v[i]] || DIGITS["0"];
      for (let k = 0; k < 15; k++) {
        const cell = document.createElement("i");
        if (map[k] === "1") cell.className = "on";
        g.appendChild(cell);
      }
      slot.appendChild(g);
    }
    box.appendChild(slot);
  }
}

function setPips() {
  const p = el("pips");
  p.innerHTML = "";
  if (state.scene === "gate1" || state.scene === "gate2" || state.scene === "letterOut") {
    el("eyebrow").textContent = "封印 " + state.gate + " / 2";
    for (let i = 0; i < 2; i++) {
      const d = document.createElement("span");
      d.className = "pip" + (i < state.gate - 1 ? " on" : "");
      p.appendChild(d);
    }
  } else {
    const eaten = desserts.filter(d => d.gone).length;
    el("eyebrow").textContent = "甜點 " + eaten + " / " + desserts.length;
    desserts.forEach(d => {
      const s = document.createElement("span");
      s.className = "pip" + (d.gone ? " on" : "");
      p.appendChild(s);
    });
  }
}

/* --- 密碼 --- */
function focusCode() { el("codeInput").focus({ preventScroll: true }); }
el("codeField").addEventListener("click", focusCode);

let autoTimer = null;
el("codeInput").addEventListener("input", () => {
  const inp = el("codeInput");
  inp.value = inp.value.replace(/\D/g, "").slice(0, 4);
  renderSlots();
  if (inp.value.length) sfx("key");
  el("gateMsg").textContent = "";
  el("gateMsg").className = "msg";
  clearTimeout(autoTimer);
  if (inp.value.length === 4) autoTimer = setTimeout(checkCode, 260);
});
el("codeInput").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); clearTimeout(autoTimer); checkCode(); }
});
el("openBtn").addEventListener("click", () => { clearTimeout(autoTimer); checkCode(); });

function checkCode() {
  const inp = el("codeInput");
  const want = state.gate === 1 ? CONFIG.code1 : CONFIG.code2;
  if (inp.value.length < 4) { el("gateMsg").textContent = "還差幾個數字。"; el("gateMsg").className = "msg err"; focusCode(); return; }
  if (inp.value === want) {
    sfx("unlock");
    state.flash = 1;
    inp.blur();
    if (state.gate === 1) playLetterOut(); else playOpen();
    return;
  }
  state.tries++;
  sfx("err");
  el("slots").classList.remove("shake");
  void el("slots").offsetWidth;
  el("slots").classList.add("shake");
  const m = el("gateMsg");
  if (state.tries >= 2) {
    m.textContent = state.gate === 1 ? CONFIG.hint1 : CONFIG.hint2;
    m.className = "msg hint";
  } else {
    m.textContent = "不是這組數字，再想一下。";
    m.className = "msg err";
  }
  inp.value = ""; renderSlots(); focusCode();
}

/* --- 流程 --- */
function playLetterOut() {
  state.scene = "letterOut"; state.at = 0;
  showPanel("wait");
  el("waitLede").textContent = "封蠟掉了……信正在被拿出來。";
  cv.setAttribute("aria-label", "信封打開，一張折好的卡片被拿出來");
}
function showGate2() {
  state.scene = "gate2"; state.gate = 2; state.tries = 0; state.at = 0;
  showPanel("gate");
  el("gateLede").textContent = CONFIG.lede2;
  el("gateMsg").textContent = ""; el("gateMsg").className = "msg";
  el("codeInput").value = ""; renderSlots(); setPips();
  el("openBtn").textContent = "打開卡片";
  cv.setAttribute("aria-label", "一張用緞帶綁著、還沒打開的卡片");
  focusCode();
}
function playOpen() {
  state.scene = "opening"; state.at = 0;
  showPanel("wait");
  el("waitLede").textContent = "卡片正在打開……";
  cv.setAttribute("aria-label", "卡片打開，天空亮起來並飛滿氣球");
}
function startWalk() {
  state.scene = "walk"; state.mode = "walking"; state.at = 0;
  state.day = 1; state.idx = 0;
  bear.x = 30; bear.phase = 0;
  refillBalloons();          // 讓天空一開始就滿是氣球
  el("foot").hidden = false; // 有熊了，才提示可以點牠
  state.stuckAt = null; state.pendingFinale = false; bear.push = 0;
  hideSceneDialog();
  showPanel("none");         // 螢幕吃掉整個高度，熊的畫面才是主角
  waitForTap();              // 第一步也要玩家點一下
  setPips();
  cv.setAttribute("aria-label", "白天的草地，天空滿是氣球，小熊沿著小路走向甜點");
}
function showWish(i) {
  showPanel("none");
  const d = desserts[i];
  showSceneDialog(d.text);
  if (d.special) { bear.hop = 1; spawnHearts(d.x, GROUND_Y - 18); }
  setPips();
}

/* 點對話框就往前走（最後一句不再前進） */
el("sceneDialog").addEventListener("click", () => {
  if (state.scene !== "walk") return;
  if (state.mode === "stuck") { pushBear(); return; }
  if (state.mode !== "wish") return;
  hideSceneDialog();
  if (state.idx >= desserts.length - 1) {
    state.pendingFinale = true;
  } else {
    state.idx++;
  }
  waitForTap();
  showPanel("none");
  setPips();
});

/* 熊只有在玩家點畫面時才會動 */
function waitForTap() {
  state.mode = "ready";
  showSceneHint(state.pendingFinale ? "點一下，陪熊走到最後" : "點一下，讓熊往前走");
}

function startSegment() {
  hideSceneDialog();
  if (state.pendingFinale) {
    state.pendingFinale = false;
    state.scene = "finale"; state.mode = "toCake"; state.at = 0;
    cv.setAttribute("aria-label", "小熊走向一個插著蠟燭的大蛋糕，旁邊有一隻吉娃娃");
    return;
  }
  state.mode = "walking";
  // 有機率在半路走不動，需要玩家再推一下
  const target = desserts[state.idx].x - 23;
  state.stuckAt = (Math.random() < 0.45 && target - bear.x > 70)
    ? bear.x + (target - bear.x) * (0.32 + Math.random() * 0.34)
    : null;
}

function pushBear() {
  hideSceneDialog();
  state.mode = "walking";
  bear.push = 1;                 // 被推一把，短暫加速
  bear.hop = 0.6;
  sfx("push");
}

el("sceneHint").addEventListener("click", e => { e.stopPropagation(); startSegment(); });

function showEnd() {
  el("eyebrow").textContent = CONFIG.to ? "給 " + CONFIG.to : "生日快樂";
  showSceneDialog(CONFIG.ending, { title: "生日快樂", last: true });
  el("foot").hidden = true;          // 走完了，操作提示收起來
  showPanel("end");
  el("replayBtn").focus({ preventScroll: true });
}

/* 再玩一次：密碼已經解過就不用再解，直接重走一遍。
   甜點會重抽，所以每次路上遇到的都不一樣。 */
function replayWalk() {
  rollDesserts();
  bear.fat = 0; bear.hop = 0; bear.mood = "idle";
  dog.hop = 0; dog.bark = 0;
  confetti = []; crumbs = []; fireworks = []; fwParts = [];
  state.camX = 0; state.camY = 0; state.camYTarget = 0;
  startWalk();
}
el("replayBtn").addEventListener("click", replayWalk);

/* 只在載入時跑一次；跑完整個流程後會停在最後一頁，重新整理才會從頭開始 */
function reset() {
  state.scene = "gate1"; state.mode = "idle"; state.gate = 1;
  state.day = 1;         // 世界永遠是白天了；黃昏改成信本身的深色底
  state.idx = 0; state.camX = 0; state.at = 0; state.tries = 0; state.flash = 0;
  state.camY = 0; state.camYTarget = 0;
  hideSceneDialog();
  bear.x = 60; bear.phase = 0; bear.hop = 0; bear.mood = "look"; bear.fat = 0; bear.push = 0;
  state.stuckAt = null; state.pendingFinale = false;
  initWorld();
  showPanel("gate");
  el("gateLede").textContent = CONFIG.lede1;
  el("openBtn").textContent = "解開";
  el("gateMsg").textContent = ""; el("gateMsg").className = "msg";
  el("codeInput").value = ""; renderSlots(); setPips();
  el("foot").hidden = true;
  cv.setAttribute("aria-label", "一封用蠟封起來的信");
}

/* 點畫面：點到吉娃娃牠會叫並冒泡泡，點別的地方熊跳一下 */
cv.addEventListener("click", e => {
  const r = cv.getBoundingClientRect();
  if (!r.width) return;
  const lx = (e.clientX - r.left) / r.width * W;
  const ly = (e.clientY - r.top) / r.height * H - state.camY;   // 換回世界的 y

  if (state.scene === "walk" || state.scene === "finale") {
    const dx = DOG_X - state.camX;
    if (Math.abs(lx - dx - 4) < 13 && ly > GROUND_Y - 30 && ly < GROUND_Y + 5) {
      if (dog.hop <= 0) dog.hop = 1;
      dog.bark = 1;
      dog.sym = (dog.sym + 1) % DOG_SYMS.length;
      sfx("bark");
      return;
    }
  }
  if (state.scene === "walk") {
    if (state.mode === "ready") { startSegment(); return; }
    if (state.mode === "stuck") { pushBear(); return; }
  }
  if (bear.hop <= 0) bear.hop = 1;
  sfx("key");
});

/* 音樂開關（預設開；瀏覽器會等到第一次點擊才真的出聲） */
function syncSoundBtn() {
  const b = el("soundBtn");
  b.textContent = soundOn ? "🔊 音樂開" : "🔇 音樂關";
  b.setAttribute("aria-pressed", String(soundOn));
}
el("soundBtn").addEventListener("click", () => {
  soundOn = !soundOn;
  syncSoundBtn();
  if (soundOn) { startBgm(); sfx("key"); } else stopBgm();
});
syncSoundBtn();

/* 走 */
layout();
initWorld();
reset();
lastVW = window.innerWidth;
requestAnimationFrame(loop);
</script>
